<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spot the Phish</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--ink:#f1f5f9;--mute:#94a3b8;--acc:#22d3ee;--acc2:#f472b6;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 22px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:28px}
header p{margin:4px 0 0;color:var(--mute);font-size:17px}
main{max-width:860px;margin:18px auto;padding:0 18px}
.prog{font-size:18px;color:var(--mute);margin-bottom:10px}
.mail,.sms{background:#fff;color:#0f172a;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px #0006}
.mh{background:#e2e8f0;padding:12px 18px;font-size:18px;line-height:1.7}
.mh .k{display:inline-block;width:64px;color:#64748b;font-size:15px}
.addr{font-family:ui-monospace,Consolas,monospace;color:#0f766e;font-size:16px;word-break:break-all}
.mb{padding:16px 20px;font-size:20px;line-height:1.55}
.mb p{margin:0 0 12px}
.sms{padding:16px 20px}
.sms .who{color:#64748b;font-size:16px;margin-bottom:8px;font-family:ui-monospace,Consolas,monospace}
.bubble{background:#e2e8f0;border-radius:18px 18px 18px 4px;padding:14px 18px;font-size:21px;line-height:1.5;max-width:92%}
a.lnk{color:#1d4ed8;text-decoration:underline;cursor:pointer;word-break:break-all}
.status{margin-top:10px;background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:16px ui-monospace,Consolas,monospace;color:var(--mute);min-height:40px}
.status.on{color:var(--acc2)}
.btns{display:flex;gap:14px;margin:18px 0;flex-wrap:wrap}
.btns button{flex:1;min-width:200px;font:700 24px system-ui;border:0;border-radius:14px;padding:18px;cursor:pointer;color:#04202a}
.real{background:var(--ok)}.fish{background:var(--acc2)}
.btns button:disabled{opacity:.35;cursor:default}
.fb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:none}
.fb.on{display:block}
.fb h2{margin:0 0 8px;font-size:26px}
.fb.good h2{color:var(--ok)}.fb.bad h2{color:var(--bad)}
.fb ul{margin:8px 0 14px;padding-left:4px;list-style:none;font-size:19px;line-height:1.5}
.fb li{margin-bottom:6px}
button.next{font:700 20px system-ui;border:0;border-radius:12px;padding:12px 22px;background:var(--acc);color:#04202a;cursor:pointer}
.end{text-align:center;padding:20px 10px}
.end h2{font-size:42px;margin:0 0 6px}
.end .big{font-size:56px;font-weight:800;color:var(--acc)}
.rules{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 22px;font-size:20px;line-height:1.6;max-width:640px;margin:18px auto}
</style>
</head>
<body>
<header>
  <h1>🎣 Spot the Phish</h1>
  <p>Phishing messages try to trick you into giving away passwords, money or personal details. Is each message <b>genuine</b> or a <b>phish</b>?</p>
</header>
<main>
  <div class="prog" id="prog"></div>
  <div id="card"></div>
  <div class="status" id="status">Hover over (or tap) any link to see where it really goes.</div>
  <div class="btns" id="btns">
    <button class="real" id="bReal">✅ Genuine</button>
    <button class="fish" id="bFish">🎣 Phish!</button>
  </div>
  <div class="fb" id="fb"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ITEMS=[
 {kind:'email',fromName:'StreamBox Support',from:'support@streambox-accounts-verify.com',subject:'URGENT: Your account will be deleted in 24 hours!',
  body:['Dear Customer,','We could not process your last payment. Your account will be DELETED within 24 hours unless you verify your details now.'],
  link:{text:'Verify my account',url:'http://streambox-login.verify-now.biz/signin'},phish:true,
  notes:['Threats and a countdown — “deleted in 24 hours” is designed to make you panic.','Generic greeting: “Dear Customer”. A real company would use your name.','The sender’s address ends in streambox-accounts-verify.com, which is not the company’s real website.','Hover over the button: it goes to a completely different website (verify-now.biz).']},
 {kind:'text',from:'Northfield High',
  body:['Northfield High: Year 7 parents’ evening is Thursday 14 Nov, 4–7pm. Book on the school website or ring reception on 01632 960123. Reply STOP to opt out.'],phish:false,
  notes:['It comes from the school’s usual sender name and matches what the school normally does.','It doesn’t ask for any personal details, money or passwords.','There is no link to click — it tells you to go to the website yourself.']},
 {kind:'email',fromName:'Hartley Library',from:'noreply@hartley-library.org.uk',subject:'Reminder: your book is due back on Friday',
  body:['Hi Sam,','“The Hobbit” is due back on Friday 18 October. You can renew it online or at the front desk.','Happy reading! — Hartley Library'],phish:false,
  notes:['It uses your name and a specific book you really borrowed.','No pressure, no threats, nothing sensitive requested.','The sender’s address matches the library’s own website name (hartley-library.org.uk).']},
 {kind:'text',from:'+44 7700 900482',
  body:['Parcel2U: We tried to deliver your parcel today. Pay a £1.99 redelivery fee within 12 hours or it will be returned:'],
  link:{text:'parcel2u-redeliver.top/pay',url:'http://parcel2u-redeliver.top/pay'},phish:true,
  notes:['A text from an unknown mobile number, not the courier’s official sender name.','A tiny fee is a trick to get your card details.','Time pressure again: “within 12 hours”.','The link ends in .top and is not the courier’s real website.']},
 {kind:'email',fromName:'GameVault Team',from:'prizes@gamevault-winners.net',subject:'🎉 YOU WON a £100 gaming voucher!!!',
  body:['Congratulations lucky player!!!','You have been picked at random to win a £100 voucher. To claim it, reply with your full name, date of birth, home address and a parent’s bank card number.'],phish:true,
  notes:['“You’ve won” a prize you never entered is almost always a scam.','It asks for personal and bank details — a real prize never needs a bank card number.','Lots of exclamation marks and excitement to stop you thinking.','The sender’s website (gamevault-winners.net) is not the real company.']},
 {kind:'email',fromName:'Mr Okafor',from:'m.okafor@northfieldhigh.org.uk',subject:'Computer Science homework',
  body:['Hi everyone,','Please finish the Python task on the class page by Monday. If you get stuck, come and see me at lunch and I’ll help.','Thanks, Mr Okafor'],phish:false,
  notes:['It comes from the school’s own email domain (northfieldhigh.org.uk).','It’s about something you expect and asks you to do something normal.','No links, no urgency, no requests for passwords.']},
 {kind:'email',fromName:'IT Helpdesk',from:'it-helpdesk@northfieldhigh-support.co',subject:'Your password expires TODAY',
  body:['Hello,','Your school password expires today. To keep your account active, reply to this email with your current username and password.'],phish:true,
  notes:['Real IT teams never ask you to send your password — not by email, not anywhere.','The domain is northfieldhigh-support.co. Look closely: it is NOT northfieldhigh.org.uk.','“Expires today” is pressure to act without thinking.']},
 {kind:'text',from:'+44 7700 900931',
  body:['Hi, it’s Alex! I’ve got a new phone so this is my new number. Can you buy me a £20 gift card? I’ll pay you back tomorrow. Don’t tell anyone, it’s a surprise 🎁'],phish:true,
  notes:['A message from a number you don’t have saved, claiming to be someone you know.','Asking for gift cards or money is a classic scam.','“Don’t tell anyone” — scammers want you to keep it secret. Always tell a trusted adult.','Check by contacting the person on the number you already have.']},
 {kind:'email',fromName:'PayQuick',from:'security@payquick.com',subject:'New sign-in to your account',
  body:['Hi Sam,','We noticed a sign-in from a new device (Chrome on Windows) at 14:02.','If this was you, you don’t need to do anything. If it wasn’t, open the PayQuick app or go to payquick.com yourself and change your password.'],phish:false,
  notes:['Calm tone — no threats or countdowns.','It tells you to open the app or type the website yourself instead of clicking a link.','The sender’s address matches the real website (payquick.com).']},
 {kind:'email',fromName:'Riverside FC',from:'coach@riversidefc.org.uk',subject:'Training moved to Wednesday',
  body:['Hi team,','Because the pitch is flooded, this week’s training is moved from Tuesday to Wednesday, 5pm as usual.','See you there! — Coach Dee'],phish:false,
  notes:['It matches a club you actually belong to.','Nothing is asked of you except turning up on a different day.','No links or requests for personal information.']}
];

let order=[],idx=0,score=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setStatus(url){const s=$('status');s.textContent=url?'🔗 This link really goes to:  '+url:'Hover over (or tap) any link to see where it really goes.';s.classList.toggle('on',!!url);}

function start(){
  order=shuffle(ITEMS.map((_,i)=>i));idx=0;score=0;
  $('btns').style.display='flex';$('status').style.display='block';
  show();
}
function show(){
  if(idx>=order.length)return finish();
  const it=ITEMS[order[idx]];answered=false;
  $('prog').textContent='Message '+(idx+1)+' of '+ITEMS.length+'  ·  Score: '+score;
  const link=it.link?'<a href="#" class="lnk" data-url="'+esc(it.link.url)+'">'+esc(it.link.text)+'</a>':'';
  let html;
  if(it.kind==='email'){
    html='<div class="mail"><div class="mh"><div><span class="k">From</span><b>'+esc(it.fromName)+'</b> <span class="addr">&lt;'+esc(it.from)+'&gt;</span></div>'+
         '<div><span class="k">Subject</span><b>'+esc(it.subject)+'</b></div></div><div class="mb">'+
         it.body.map(p=>'<p>'+esc(p)+'</p>').join('')+(link?'<p>'+link+'</p>':'')+'</div></div>';
  }else{
    html='<div class="sms"><div class="who">From: '+esc(it.from)+'</div><div class="bubble">'+it.body.map(esc).join('<br>')+(link?' '+link:'')+'</div></div>';
  }
  $('card').innerHTML=html;
  setStatus('');
  document.querySelectorAll('.lnk').forEach(a=>{
    a.onmouseenter=()=>setStatus(a.dataset.url);
    a.onmouseleave=()=>setStatus('');
    a.onclick=e=>{e.preventDefault();setStatus(a.dataset.url);};
  });
  $('bReal').disabled=false;$('bFish').disabled=false;
  $('fb').className='fb';$('fb').innerHTML='';
}
function answer(sayPhish){
  if(answered)return;answered=true;
  const it=ITEMS[order[idx]];
  const ok=(sayPhish===it.phish);if(ok)score++;
  $('bReal').disabled=true;$('bFish').disabled=true;
  $('prog').textContent='Message '+(idx+1)+' of '+ITEMS.length+'  ·  Score: '+score;
  const last=idx===order.length-1;
  $('fb').className='fb on '+(ok?'good':'bad');
  $('fb').innerHTML='<h2>'+(ok?'✅ Correct! ':'❌ Not quite. ')+'This one is '+(it.phish?'a PHISH 🎣':'GENUINE ✅')+'</h2>'+
    '<ul>'+it.notes.map(n=>'<li>'+(it.phish?'🚩 ':'👍 ')+esc(n)+'</li>').join('')+'</ul>'+
    '<button class="next" id="next">'+(last?'See my score ➜':'Next message ➜')+'</button>';
  $('next').onclick=()=>{idx++;show();};
}
function finish(){
  $('btns').style.display='none';$('status').style.display='none';$('fb').className='fb';
  $('prog').textContent='';
  const n=ITEMS.length;
  const rating=score===n?'🏆 Phish-proof!':score>=8?'🥇 Great spotting!':score>=5?'🥈 Getting there!':'🥉 Keep practising!';
  $('card').innerHTML='<div class="end"><h2>'+rating+'</h2><div class="big">'+score+' / '+n+'</div>'+
   '<div class="rules"><b>Three golden rules</b><br>1. <b>Stop and think.</b> Panic, prizes and countdowns are red flags.<br>2. <b>Check the sender and the link.</b> Does the address really match the company?<br>3. <b>Never share passwords or bank details</b> — and tell a trusted adult if something feels wrong.</div>'+
   '<button class="next" id="again">Play again ↺</button></div>';
  $('again').onclick=start;
}
$('bReal').onclick=()=>answer(false);
$('bFish').onclick=()=>answer(true);

/* reset after 3 idle minutes so the next visitor starts fresh */
let idle;function bump(){clearTimeout(idle);idle=setTimeout(start,180000);}
['keydown','mousedown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,bump,{passive:true}));
start();bump();
</script>
<!--OEB-->
<script>window.OEB_CFG={id:"phish",type:"score",get max(){return ITEMS.length},getScore:function(){return score}};</script>
<script>(function(){
var C=window.OEB_CFG||{};if(!C.id)return;
var KEY='oeb:'+C.id,BAD=['ASS','SEX','FUK','FCK','FUC','CUM','TIT','WTF','KKK','NZI','SHT','DIK','DCK','PIS','CNT','FAG','JEW'];
var mem=[];
function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(v))return v;}catch(e){}return mem;}
function save(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
function fmt(t){var m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s;}
function rank(a){return a.slice().sort(function(x,y){return C.type==='score'?((y.s-x.s)||(x.t-y.t)):(x.t-y.t);});}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
var st=document.createElement('style');
st.textContent='#oeboard{max-width:1200px;margin:6px auto 26px;padding:14px 20px;background:var(--panel,#161f33);border:2px solid var(--acc2,#fbbf24);border-radius:14px;color:var(--ink,#e8eef9);font-family:system-ui,sans-serif}#oeboard h3{margin:0 0 8px;font-size:22px;color:var(--acc2,#fbbf24);user-select:none}#oeboard ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}#oeboard li{background:#0f1a30;border:1px solid var(--line,#2b3a57);border-radius:10px;padding:8px 12px;font-size:20px;font-weight:700;font-family:ui-monospace,Consolas,monospace}#oeboard li small{color:var(--mute,#8fa1c0);font-weight:500;font-size:15px}#oeboard li.me{border-color:var(--good,#34d399);background:#14463a}#oeboard .none{color:var(--mute,#8fa1c0);font-size:18px}#oeboard .clr{margin-top:10px;font-size:14px;opacity:.7;background:#4a1f26;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}.oeb-entry{margin:18px auto 4px;max-width:560px;background:#0f1a30;border:2px solid var(--acc2,#fbbf24);border-radius:14px;padding:14px 18px;font-size:20px;line-height:1.5}.oeb-entry input{font:700 28px ui-monospace,Consolas,monospace;width:110px;text-align:center;text-transform:uppercase;letter-spacing:.2em;border-radius:10px;border:2px solid var(--line,#2b3a57);background:#161f33;color:#fff;padding:6px}.oeb-entry button{font:inherit;font-weight:700;background:var(--acc2,#fbbf24);color:#1a1200;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;margin-left:6px}.oeb-entry .err{color:var(--bad,#f87171);font-size:17px;min-height:22px}';
document.head.appendChild(st);
var t0=null,saved=false;
function touch(){if(t0===null)t0=Date.now();}
['mousedown','keydown','touchstart'].forEach(function(e){document.addEventListener(e,touch,true);});
document.addEventListener('click',function(e){var b=e.target;if(b&&b.id==='restart'&&/^Sure/.test(b.textContent))t0=null;},true);
var idle;function idleReset(){clearTimeout(idle);idle=setTimeout(function(){t0=null;},180000);}
['mousedown','keydown','mousemove','touchstart'].forEach(function(e){document.addEventListener(e,idleReset,{passive:true});});
var panel=document.createElement('div');panel.id='oeboard';
var ref=document.querySelector('main');(ref&&ref.parentNode?ref.parentNode:document.body).insertBefore(panel,ref?ref.nextSibling:null);
var mine=null,clrShown=false,armed=false;
function renderBoard(){
  var a=rank(load()).slice(0,5);
  var h='<h3 id="oebh">🏆 Top 5 on this PC today — can you beat them?</h3>';
  if(!a.length)h+='<div class="none">No scores yet. Be the first on the board!</div>';
  else h+='<ol>'+a.map(function(x,i){return '<li'+(mine&&x.id===mine?' class="me"':'')+'>'+(['🥇','🥈','🥉','4.','5.'][i])+' '+esc(x.i)+' <small>'+(C.type==='score'?x.s+'/'+C.max+' · ':'')+fmt(x.t)+'</small></li>';}).join('')+'</ol>';
  if(clrShown)h+='<button class="clr" id="oebclr">Staff: clear this board</button>';
  panel.innerHTML=h;
  var hd=document.getElementById('oebh');if(hd)hd.ondblclick=function(){clrShown=true;renderBoard();};
  var c=document.getElementById('oebclr');
  if(c)c.onclick=function(){if(!armed){armed=true;c.textContent='Sure? Click again to delete ALL scores';setTimeout(function(){armed=false;clrShown=false;renderBoard();},4000);}else{save([]);armed=false;clrShown=false;mine=null;renderBoard();}};
}
function attach(w){
  if(w.getAttribute('data-oeb'))return;w.setAttribute('data-oeb','1');
  if(t0===null)t0=Date.now();
  var secs=Math.max(1,Math.round((Date.now()-t0)/1000)),sc=0;
  if(C.type==='score'){try{sc=C.getScore();}catch(e){sc=0;}}
  saved=false;
  var d=document.createElement('div');d.className='oeb-entry';
  d.innerHTML='<div>⏱ Your time: <b>'+fmt(secs)+'</b>'+(C.type==='score'?' · Score: <b>'+sc+'/'+C.max+'</b>':'')+'</div><div style="margin-top:8px">Add your <b>initials</b> to the leaderboard:<br><input id="oebin" maxlength="3" autocomplete="off" spellcheck="false"><button id="oebsave">Save</button></div><div class="err" id="oebe"></div>';
  w.appendChild(d);
  var inp=d.querySelector('#oebin'),go=d.querySelector('#oebsave'),er=d.querySelector('#oebe');
  inp.oninput=function(){inp.value=inp.value.replace(/[^a-zA-Z]/g,'').toUpperCase();};
  function doSave(){
    var v=inp.value.toUpperCase();
    if(!/^[A-Z]{2,3}$/.test(v)){er.textContent='Please enter 2 or 3 letters (initials only).';return;}
    if(BAD.indexOf(v)>-1){er.textContent='Please choose different initials.';return;}
    var a=load().slice();var id=Date.now()+'-'+Math.random().toString(36).slice(2,6);
    a.push({i:v,s:sc,t:secs,id:id});a=rank(a).slice(0,30);save(a);mine=id;saved=true;
    var pos=rank(a).findIndex(function(x){return x.id===id;})+1;
    d.innerHTML='<div style="font-size:24px">✅ Saved! You are <b>#'+pos+'</b> on the board today.</div><div class="mute" style="font-size:17px;margin-top:4px">Tell a friend to come and beat you!</div>';
    renderBoard();
  }
  go.onclick=doSave;inp.onkeydown=function(e){if(e.key==='Enter')doSave();};
  setTimeout(function(){try{inp.focus();}catch(e){}},50);
}
var mo=new MutationObserver(function(){var w=document.querySelector('.win,.end');if(w)attach(w);});
mo.observe(document.body,{childList:true,subtree:true});
// when the win screen disappears (play again / reset), start a fresh clock
var mo2=new MutationObserver(function(){if(!document.querySelector('.win,.end')&&window.__oebWas){window.__oebWas=false;t0=null;mine=null;renderBoard();}else if(document.querySelector('.win,.end'))window.__oebWas=true;});
mo2.observe(document.body,{childList:true,subtree:true});
renderBoard();
})();
</script>
<!--/OEB-->
</body>
</html>
