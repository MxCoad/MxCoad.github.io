<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fix the Robot</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--ink:#f1f5f9;--mute:#94a3b8;--acc:#22d3ee;--acc2:#f472b6;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 22px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:28px}
header p{margin:4px 0 0;color:var(--mute);font-size:17px}
.wrap{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:18px;padding:18px;max-width:1300px;margin:auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.dots{display:flex;gap:8px;margin-bottom:10px}
.dot{width:34px;height:10px;border-radius:5px;background:#334155}.dot.done{background:var(--ok)}.dot.cur{background:var(--warn)}
.lvl{font-size:20px;color:var(--warn);font-weight:700}
.bug{background:#3b0d1a;border:1px solid #7f1d3a;color:#fecdd3;border-radius:10px;padding:10px 14px;font-size:18px;margin-top:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:#334155;color:var(--ink);font-weight:600}
button:hover{background:#475569}button:disabled{opacity:.4;cursor:default}
button.go{background:var(--ok);color:#052e16;font-size:20px;padding:11px 22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.stack{display:flex;flex-direction:column;gap:6px}
.blk{border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700;font-size:18px;color:#04202a}
.blk.fwd{background:#67e8f9}.blk.left{background:#fcd34d}.blk.right{background:#fda4af}.blk.rep{background:#c4b5fd;flex-direction:column;align-items:stretch}
.blk .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk .sp{flex:1}
.blk button{background:#ffffff80;color:#0f172a;padding:2px 9px;font-size:16px;border-radius:7px}
.blk button:hover{background:#fff}
.blk .num{background:#fff;border-radius:7px;padding:1px 10px;min-width:34px;text-align:center}
.inner{margin-left:18px;padding:8px;border-left:4px solid #8b5cf6;background:#ffffff40;border-radius:8px;display:flex;flex-direction:column;gap:6px}
.mini{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.mini span{color:#312e81}
.palette button{font-size:18px}
.empty{color:var(--mute);font-style:italic;padding:6px}
#gridBox{display:flex;justify-content:center}
#grid{position:relative;border:4px solid #475569;border-radius:12px;background:#0b1220}
.c{position:absolute;display:flex;align-items:center;justify-content:center;font-size:30px;border:1px solid #1e293b}
.c.wall{background:#475569}
.c.goal{background:#14532d}
#bot{position:absolute;display:flex;align-items:center;justify-content:center;font-size:34px;transition:left .28s,top .28s,transform .28s;z-index:3}
#bot.shake{animation:shake .4s}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-8px}75%{margin-left:8px}}
.msg{min-height:30px;font-size:21px;font-weight:700;margin-top:8px}
.good{color:var(--ok)}.bad{color:var(--bad)}
.win{text-align:center;padding:40px 10px}.win h2{font-size:44px;margin:0 0 10px}
.key{color:var(--mute);font-size:15px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🤖 Fix the Robot</h1>
  <p>Each program has a <b>bug</b>, so the robot never reaches the ⭐. Fix the blocks, press <b>Run</b>, and get it home!</p>
</header>
<div class="wrap">
  <section>
    <div class="card" id="side"></div>
  </section>
  <section>
    <div class="card">
      <div id="gridBox"><div id="grid"></div></div>
      <div class="key">🤖 robot · ⭐ goal · grey squares are walls · the robot starts facing the way the nose points (▶ ▲ ▼ ◀)</div>
    </div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const DX=[0,1,0,-1],DY=[-1,0,1,0];            // 0=N 1=E 2=S 3=W
const ARROW=['▲','▶','▼','◀'];
const F=()=>({t:'fwd'}),L=()=>({t:'left'}),R=()=>({t:'right'}),REP=(n,...b)=>({t:'rep',n,body:b});
const LEVELS=[
 {title:'A step short',bug:'The robot stops one square too early. Something is missing!',
  grid:['.....','.....','.....','.....','.....'],sx:0,sy:0,sd:1,gx:4,gy:4,
  prog:()=>[F(),F(),F(),R(),F(),F(),F(),F()]},
 {title:'Not enough loops',bug:'The robot walks a staircase, but stops before the ⭐. How many times should it repeat?',
  grid:['.....','.....','.....','.....','.....'],sx:0,sy:0,sd:1,gx:3,gy:3,
  prog:()=>[REP(2,F(),R(),F(),L())]},
 {title:'Around the wall',bug:'The robot has to go around the wall — but it ends up in the wrong place. Check the turns!',
  grid:['...#..','...#..','...#..','......','......'],sx:0,sy:0,sd:1,gx:5,gy:2,
  prog:()=>[R(),REP(3,F()),L(),REP(5,F()),R(),F()]},
 {title:'Wrong order',bug:'The robot bumps into the edge of the grid. The blocks are right, but are they in the right order?',
  grid:['.....','.....','.....','.....','.....'],sx:0,sy:4,sd:0,gx:4,gy:0,
  prog:()=>[R(),REP(4,F()),REP(4,F())]},
 {title:'Mirror image',bug:'This staircase goes the wrong way and the robot hits the edge. Can you spot the problem?',
  grid:['.......','.......','.......','.......','.......','.......','.......'],sx:0,sy:6,sd:0,gx:6,gy:0,
  prog:()=>[REP(6,F(),L(),F(),R())]}
];
let lv=0,prog=[],running=false,timer=null;

function flatten(list,out=[]){for(const b of list){if(b.t==='rep'){for(let k=0;k<b.n;k++)flatten(b.body,out);}else out.push(b.t);}return out;}
function simulate(level,cmds){
  let x=level.sx,y=level.sy,d=level.sd;const path=[{x,y,d}];
  for(const c of cmds){
    if(c==='left')d=(d+3)%4;else if(c==='right')d=(d+1)%4;
    else{
      const nx=x+DX[d],ny=y+DY[d];
      const row=level.grid[ny];
      if(!row||nx<0||nx>=row.length||row[nx]==='#'){path.push({x,y,d,bump:true});return{path,bump:true,x,y};}
      x=nx;y=ny;
    }
    path.push({x,y,d});
  }
  return{path,bump:false,x,y};
}

/* ---------- drawing ---------- */
const CELL=62;
function drawGrid(){
  const L_=LEVELS[lv],g=$('grid'),h=L_.grid.length,w=L_.grid[0].length;
  g.style.width=w*CELL+'px';g.style.height=h*CELL+'px';g.innerHTML='';
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const c=document.createElement('div');c.className='c'+(L_.grid[y][x]==='#'?' wall':'')+((x===L_.gx&&y===L_.gy)?' goal':'');
    c.style.cssText+='left:'+x*CELL+'px;top:'+y*CELL+'px;width:'+CELL+'px;height:'+CELL+'px';
    if(x===L_.gx&&y===L_.gy)c.textContent='⭐';
    g.appendChild(c);
  }
  const b=document.createElement('div');b.id='bot';b.style.width=b.style.height=CELL+'px';b.innerHTML='<span id="botface">🤖</span><span id="nose" style="position:absolute;font-size:16px;color:#22d3ee"></span>';
  g.appendChild(b);
  placeBot(L_.sx,L_.sy,L_.sd);
}
function placeBot(x,y,d){
  const b=$('bot');b.style.left=x*CELL+'px';b.style.top=y*CELL+'px';
  const n=$('nose');n.textContent=ARROW[d];
  const pos=[['50%','-2px'],['auto','50%'],['50%','auto'],['2px','50%']];
  n.style.cssText='position:absolute;font-size:16px;color:#22d3ee;'+['top:-4px;left:calc(50% - 8px)','right:-2px;top:calc(50% - 10px)','bottom:-4px;left:calc(50% - 8px)','left:-2px;top:calc(50% - 10px)'][d];
}

/* ---------- program editor ---------- */
const NAMES={fwd:'▲ Move forward',left:'⟲ Turn left',right:'⟳ Turn right',rep:'🔁 Repeat'};
function mk(t){return t==='fwd'?F():t==='left'?L():R();}
function swap(list,i,j){if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];renderProg();}
function blockEl(b,list,i){
  const el=document.createElement('div');el.className='blk '+b.t;
  const hd=document.createElement('div');hd.className='hd';
  hd.innerHTML='<span>'+NAMES[b.t]+'</span>';
  if(b.t==='rep'){
    const minus=document.createElement('button');minus.textContent='−';minus.onclick=()=>{if(b.n>1){b.n--;renderProg();}};
    const num=document.createElement('span');num.className='num';num.textContent=b.n;
    const plus=document.createElement('button');plus.textContent='+';plus.onclick=()=>{if(b.n<9){b.n++;renderProg();}};
    hd.append(minus,num,plus,document.createTextNode('times'));
  }
  const sp=document.createElement('span');sp.className='sp';hd.appendChild(sp);
  const up=document.createElement('button');up.textContent='↑';up.onclick=()=>swap(list,i,i-1);
  const dn=document.createElement('button');dn.textContent='↓';dn.onclick=()=>swap(list,i,i+1);
  const del=document.createElement('button');del.textContent='✕';del.onclick=()=>{list.splice(i,1);renderProg();};
  [up,dn,del].forEach(x=>x.disabled=running);
  hd.append(up,dn,del);el.appendChild(hd);
  if(b.t==='rep'){
    const inner=document.createElement('div');inner.className='inner';
    if(!b.body.length){const e=document.createElement('div');e.className='empty';e.textContent='(empty — add a block inside)';inner.appendChild(e);}
    b.body.forEach((c,j)=>inner.appendChild(blockEl(c,b.body,j)));
    const mini=document.createElement('div');mini.className='mini';mini.innerHTML='<span>add inside:</span>';
    ['fwd','left','right'].forEach(t=>{const bt=document.createElement('button');bt.textContent=NAMES[t].split(' ')[0];bt.title=NAMES[t];bt.disabled=running;bt.onclick=()=>{b.body.push(mk(t));renderProg();};mini.appendChild(bt);});
    inner.appendChild(mini);el.appendChild(inner);
  }
  return el;
}
function renderProg(){
  const s=$('stack');if(!s)return;
  s.innerHTML='';
  if(!prog.length){const e=document.createElement('div');e.className='empty';e.textContent='(no blocks yet — add some below)';s.appendChild(e);}
  prog.forEach((b,i)=>s.appendChild(blockEl(b,prog,i)));
}

/* ---------- screens ---------- */
function renderLevel(){
  clearTimeout(timer);running=false;
  const side=$('side');
  if(lv>=LEVELS.length){
    side.innerHTML='<div class="win"><h2>🏆 All five bugs fixed!</h2><p style="font-size:21px">You debug like a pro. Show a member of staff your screen to claim your prize.</p><button class="go" id="again">Play again</button></div>';
    $('grid').innerHTML='';$('again').onclick=()=>{lv=0;renderLevel();};return;
  }
  const L_=LEVELS[lv];prog=L_.prog();
  let dots='';LEVELS.forEach((_,i)=>dots+='<div class="dot '+(i<lv?'done':i===lv?'cur':'')+'"></div>');
  side.innerHTML='<div class="dots">'+dots+'</div><div class="lvl">Level '+(lv+1)+' of '+LEVELS.length+' · '+L_.title+'</div>'+
    '<div class="bug">🐛 '+L_.bug+'</div>'+
    '<div style="margin-top:12px"><b>Program</b> <span class="mute" style="color:var(--mute);font-size:15px">(runs from the top down)</span></div>'+
    '<div class="stack" id="stack" style="margin-top:6px"></div>'+
    '<div class="row palette"><span style="color:var(--mute)">Add:</span><button data-a="fwd">▲ Forward</button><button data-a="left">⟲ Left</button><button data-a="right">⟳ Right</button><button data-a="rep">🔁 Repeat</button></div>'+
    '<div class="row"><button class="go" id="run">▶ Run</button><button id="fixreset">↺ Undo my changes</button><button id="restart">↺ Start again</button></div>'+
    '<div class="msg" id="msg"></div>';
  side.querySelectorAll('.palette button').forEach(b=>b.onclick=()=>{
    if(running)return;const a=b.dataset.a;prog.push(a==='rep'?REP(2,F()):mk(a));renderProg();
  });
  $('run').onclick=run;
  $('fixreset').onclick=()=>{if(running)return;prog=L_.prog();placeBot(L_.sx,L_.sy,L_.sd);$('msg').textContent='';renderProg();};
  let armed=false,armT;
  $('restart').onclick=()=>{
    if(!armed){armed=true;$('restart').textContent='Sure? Click again to restart from Level 1';armT=setTimeout(()=>{armed=false;const r=$('restart');if(r)r.textContent='↺ Start again';},4000);}
    else{clearTimeout(armT);lv=0;renderLevel();}
  };
  drawGrid();renderProg();
}
function run(){
  if(running)return;
  const L_=LEVELS[lv];
  const cmds=flatten(prog);
  const msg=$('msg');msg.className='msg';
  if(!cmds.length){msg.className='msg bad';msg.textContent='Add some blocks first!';return;}
  if(cmds.length>400){msg.className='msg bad';msg.textContent='That program is too long!';return;}
  running=true;renderProg();$('run').disabled=true;
  placeBot(L_.sx,L_.sy,L_.sd);msg.textContent='Running…';
  const res=simulate(L_,cmds);
  let k=0;
  const step=()=>{
    if(k>=res.path.length){finish(res);return;}
    const p=res.path[k++];
    if(p.bump){const b=$('bot');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
    placeBot(p.x,p.y,p.d);
    timer=setTimeout(step,300);
  };
  step();
}
function finish(res){
  const L_=LEVELS[lv],msg=$('msg');
  running=false;renderProg();$('run').disabled=false;
  if(res.x===L_.gx&&res.y===L_.gy&&!res.bump){
    msg.className='msg good';msg.textContent='🎉 Bug fixed! The robot reached the ⭐';
    $('run').disabled=true;
    timer=setTimeout(()=>{lv++;renderLevel();},1800);
  }else if(res.bump){
    msg.className='msg bad';msg.textContent='💥 Bump! The robot hit a wall. Look for the bug and try again.';
  }else{
    msg.className='msg bad';msg.textContent='The robot stopped in the wrong place. Look for the bug and try again.';
  }
}

/* reset after 3 idle minutes so the next visitor starts fresh */
let idle;function bump(){clearTimeout(idle);idle=setTimeout(()=>{lv=0;renderLevel();},180000);}
['keydown','mousedown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,bump,{passive:true}));
renderLevel();bump();
</script>
<!--OEB-->
<script>window.OEB_CFG={id:"robot",type:"time"};</script>
<script>(function(){
var C=window.OEB_CFG||{};if(!C.id)return;
var KEY='oeb:'+C.id,BAD=['ASS','SEX','FUK','FCK','FUC','CUM','TIT','WTF','KKK','NZI','SHT','DIK','DCK','PIS','CNT','FAG','JEW'];
var mem=[];
function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(v))return v;}catch(e){}return mem;}
function save(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
function fmt(t){var m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s;}
function rank(a){return a.slice().sort(function(x,y){return C.type==='score'?((y.s-x.s)||(x.t-y.t)):(x.t-y.t);});}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
var st=document.createElement('style');
st.textContent='#oeboard{max-width:1200px;margin:6px auto 26px;padding:14px 20px;background:var(--panel,#161f33);border:2px solid var(--acc2,#fbbf24);border-radius:14px;color:var(--ink,#e8eef9);font-family:system-ui,sans-serif}#oeboard h3{margin:0 0 8px;font-size:22px;color:var(--acc2,#fbbf24);user-select:none}#oeboard ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}#oeboard li{background:#0f1a30;border:1px solid var(--line,#2b3a57);border-radius:10px;padding:8px 12px;font-size:20px;font-weight:700;font-family:ui-monospace,Consolas,monospace}#oeboard li small{color:var(--mute,#8fa1c0);font-weight:500;font-size:15px}#oeboard li.me{border-color:var(--good,#34d399);background:#14463a}#oeboard .none{color:var(--mute,#8fa1c0);font-size:18px}#oeboard .clr{margin-top:10px;font-size:14px;opacity:.7;background:#4a1f26;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}.oeb-entry{margin:18px auto 4px;max-width:560px;background:#0f1a30;border:2px solid var(--acc2,#fbbf24);border-radius:14px;padding:14px 18px;font-size:20px;line-height:1.5}.oeb-entry input{font:700 28px ui-monospace,Consolas,monospace;width:110px;text-align:center;text-transform:uppercase;letter-spacing:.2em;border-radius:10px;border:2px solid var(--line,#2b3a57);background:#161f33;color:#fff;padding:6px}.oeb-entry button{font:inherit;font-weight:700;background:var(--acc2,#fbbf24);color:#1a1200;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;margin-left:6px}.oeb-entry .err{color:var(--bad,#f87171);font-size:17px;min-height:22px}';
document.head.appendChild(st);
var t0=null,saved=false;
function touch(){if(t0===null)t0=Date.now();}
['mousedown','keydown','touchstart'].forEach(function(e){document.addEventListener(e,touch,true);});
document.addEventListener('click',function(e){var b=e.target;if(b&&b.id==='restart'&&/^Sure/.test(b.textContent))t0=null;},true);
var idle;function idleReset(){clearTimeout(idle);idle=setTimeout(function(){t0=null;},180000);}
['mousedown','keydown','mousemove','touchstart'].forEach(function(e){document.addEventListener(e,idleReset,{passive:true});});
var panel=document.createElement('div');panel.id='oeboard';
var ref=document.querySelector('main');(ref&&ref.parentNode?ref.parentNode:document.body).insertBefore(panel,ref?ref.nextSibling:null);
var mine=null,clrShown=false,armed=false;
function renderBoard(){
  var a=rank(load()).slice(0,5);
  var h='<h3 id="oebh">🏆 Top 5 on this PC today — can you beat them?</h3>';
  if(!a.length)h+='<div class="none">No scores yet. Be the first on the board!</div>';
  else h+='<ol>'+a.map(function(x,i){return '<li'+(mine&&x.id===mine?' class="me"':'')+'>'+(['🥇','🥈','🥉','4.','5.'][i])+' '+esc(x.i)+' <small>'+(C.type==='score'?x.s+'/'+C.max+' · ':'')+fmt(x.t)+'</small></li>';}).join('')+'</ol>';
  if(clrShown)h+='<button class="clr" id="oebclr">Staff: clear this board</button>';
  panel.innerHTML=h;
  var hd=document.getElementById('oebh');if(hd)hd.ondblclick=function(){clrShown=true;renderBoard();};
  var c=document.getElementById('oebclr');
  if(c)c.onclick=function(){if(!armed){armed=true;c.textContent='Sure? Click again to delete ALL scores';setTimeout(function(){armed=false;clrShown=false;renderBoard();},4000);}else{save([]);armed=false;clrShown=false;mine=null;renderBoard();}};
}
function attach(w){
  if(w.getAttribute('data-oeb'))return;w.setAttribute('data-oeb','1');
  if(t0===null)t0=Date.now();
  var secs=Math.max(1,Math.round((Date.now()-t0)/1000)),sc=0;
  if(C.type==='score'){try{sc=C.getScore();}catch(e){sc=0;}}
  saved=false;
  var d=document.createElement('div');d.className='oeb-entry';
  d.innerHTML='<div>⏱ Your time: <b>'+fmt(secs)+'</b>'+(C.type==='score'?' · Score: <b>'+sc+'/'+C.max+'</b>':'')+'</div><div style="margin-top:8px">Add your <b>initials</b> to the leaderboard:<br><input id="oebin" maxlength="3" autocomplete="off" spellcheck="false"><button id="oebsave">Save</button></div><div class="err" id="oebe"></div>';
  w.appendChild(d);
  var inp=d.querySelector('#oebin'),go=d.querySelector('#oebsave'),er=d.querySelector('#oebe');
  inp.oninput=function(){inp.value=inp.value.replace(/[^a-zA-Z]/g,'').toUpperCase();};
  function doSave(){
    var v=inp.value.toUpperCase();
    if(!/^[A-Z]{2,3}$/.test(v)){er.textContent='Please enter 2 or 3 letters (initials only).';return;}
    if(BAD.indexOf(v)>-1){er.textContent='Please choose different initials.';return;}
    var a=load().slice();var id=Date.now()+'-'+Math.random().toString(36).slice(2,6);
    a.push({i:v,s:sc,t:secs,id:id});a=rank(a).slice(0,30);save(a);mine=id;saved=true;
    var pos=rank(a).findIndex(function(x){return x.id===id;})+1;
    d.innerHTML='<div style="font-size:24px">✅ Saved! You are <b>#'+pos+'</b> on the board today.</div><div class="mute" style="font-size:17px;margin-top:4px">Tell a friend to come and beat you!</div>';
    renderBoard();
  }
  go.onclick=doSave;inp.onkeydown=function(e){if(e.key==='Enter')doSave();};
  setTimeout(function(){try{inp.focus();}catch(e){}},50);
}
var mo=new MutationObserver(function(){var w=document.querySelector('.win,.end');if(w)attach(w);});
mo.observe(document.body,{childList:true,subtree:true});
// when the win screen disappears (play again / reset), start a fresh clock
var mo2=new MutationObserver(function(){if(!document.querySelector('.win,.end')&&window.__oebWas){window.__oebWas=false;t0=null;mine=null;renderBoard();}else if(document.querySelector('.win,.end'))window.__oebWas=true;});
mo2.observe(document.body,{childList:true,subtree:true});
renderBoard();
})();
</script>
<!--/OEB-->
</body>
</html>
