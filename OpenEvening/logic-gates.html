<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logic Gate Puzzles</title>
<style>
:root{--bg:#0b1120;--panel:#161f33;--line:#2b3a57;--ink:#e8eef9;--mute:#8fa1c0;--acc:#34d399;--acc2:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 22px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:28px}
header p{margin:4px 0 0;color:var(--mute);font-size:17px}
main{max-width:1100px;margin:18px auto;padding:0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.dots{display:flex;gap:8px;margin-bottom:10px}
.dot{width:36px;height:10px;border-radius:5px;background:#2b3a57}.dot.done{background:var(--acc)}.dot.cur{background:var(--acc2)}
.lvl{font-size:22px;color:var(--acc2);font-weight:700}
.story{font-size:20px;margin:6px 0 4px}
.how{color:var(--mute);font-size:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:#2b3a57;color:var(--ink);font-weight:600}
button:hover{background:#3b4f75}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
svg{width:100%;height:auto;display:block;background:#0b1120;border:1px solid var(--line);border-radius:12px;user-select:none}
svg text{font-family:ui-monospace,Consolas,monospace}
.gate{cursor:pointer}.gate:hover rect{stroke:#fff}
.inp{cursor:pointer}
table{border-collapse:collapse;font:600 18px ui-monospace,Consolas,monospace;margin-top:6px}
th,td{border:1px solid var(--line);padding:6px 14px;text-align:center}
th{background:#0f1a30;color:var(--mute);font-size:15px}
td.ok{color:var(--acc)}td.no{color:var(--bad)}
tr.cur td{background:#1d2c4a}
.msg{min-height:30px;font-size:21px;font-weight:700;margin-top:8px}
.good{color:var(--acc)}.bad{color:var(--bad)}.hint{color:var(--acc2);font-size:18px;margin-top:6px}
.win{text-align:center;padding:40px 10px}.win h2{font-size:44px;margin:0 0 10px}
.cols{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.legend{color:var(--mute);font-size:15px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>💡 Logic Gate Puzzles</h1>
  <p>Choose the right gate for every box so the circuit behaves exactly as described. Click a gate to change it. Click an input to flick the switch.</p>
</header>
<main><div id="game"></div></main>

<script>
const $=id=>document.getElementById(id);
const GATES={AND:(a,b)=>a&b,OR:(a,b)=>a|b,XOR:(a,b)=>a^b,NAND:(a,b)=>1-(a&b),NOR:(a,b)=>1-(a|b)};
const OPTS=['OR','NOR','AND','XOR','NAND'];
const LEVELS=[
 {title:'The vault',story:'The vault door opens only when <b>both</b> key-holders turn their keys at the same time.',
  inputs:['A','B'],gates:[{id:'g1',ins:['A','B'],col:1}],outs:[{label:'DOOR',src:'g1'}],
  target:v=>[v.A&v.B],hint:'Which gate gives 1 only when both inputs are 1?'},
 {title:'Staircase light',story:'A light on a staircase has a switch at the top (A) and at the bottom (B). <b>Flicking either switch</b> should toggle the light.',
  inputs:['A','B'],gates:[{id:'g1',ins:['A','B'],col:1}],outs:[{label:'LIGHT',src:'g1'}],
  target:v=>[v.A^v.B],hint:'The light should be ON when the two switches are in different positions.'},
 {title:'Burglar alarm',story:'The alarm sounds if <b>both</b> the door sensor (A) and the window sensor (B) are triggered, <b>or</b> if the panic button (C) is pressed.',
  inputs:['A','B','C'],gates:[{id:'g1',ins:['A','B'],col:1},{id:'g2',ins:['g1','C'],col:2}],outs:[{label:'ALARM',src:'g2'}],
  target:v=>[(v.A&v.B)|v.C],hint:'Work from the left: first combine A and B, then deal with C.'},
 {title:'Half adder',story:'Add two 1-bit numbers. <b>SUM</b> is the digit you write down; <b>CARRY</b> is 1 when the answer needs a new column (1 + 1 = 10 in binary).',
  inputs:['A','B'],gates:[{id:'g1',ins:['A','B'],col:1},{id:'g2',ins:['A','B'],col:1}],outs:[{label:'SUM',src:'g1'},{label:'CARRY',src:'g2'}],
  target:v=>[v.A^v.B,v.A&v.B],hint:'SUM is 1 when the inputs differ. CARRY is 1 only when both are 1.'},
 {title:'Majority vote',story:'Three judges vote. <b>WIN</b> should be 1 when <b>at least two</b> of the three judges vote 1.',
  inputs:['A','B','C'],gates:[{id:'g1',ins:['A','B'],col:1},{id:'g2',ins:['B','C'],col:1},{id:'g3',ins:['A','C'],col:1},{id:'g4',ins:['g1','g2'],col:2},{id:'g5',ins:['g4','g3'],col:3}],
  outs:[{label:'WIN',src:'g5'}],target:v=>[(v.A&v.B)|(v.B&v.C)|(v.A&v.C)],hint:'Each of the first three gates looks at one pair of judges. What does it mean if a pair both vote 1?'},
 {title:'Full adder',story:'The building block of every CPU’s adder: add <b>A</b> + <b>B</b> + a carry-in (<b>CIN</b>). Output the <b>SUM</b> digit and a carry-out (<b>COUT</b>).',
  inputs:['A','B','CIN'],gates:[{id:'g1',ins:['A','B'],col:1},{id:'g3',ins:['A','B'],col:1},{id:'g2',ins:['g1','CIN'],col:2},{id:'g4',ins:['g1','CIN'],col:2},{id:'g5',ins:['g3','g4'],col:3}],
  outs:[{label:'SUM',src:'g2'},{label:'COUT',src:'g5'}],
  target:v=>[v.A^v.B^v.CIN,(v.A&v.B)|(v.CIN&(v.A^v.B))],hint:'Build it from two half adders and an OR gate to combine their carries.'}
];

let lv=0,choice={},sw={},hintOn=false,locked=false,armedT;

function evalNet(L,vals,ch){
  const memo=Object.assign({},vals);
  function val(id){
    if(id in memo)return memo[id];
    const g=L.gates.find(x=>x.id===id),c=ch[id];
    return memo[id]=c?GATES[c](val(g.ins[0]),val(g.ins[1])):0;
  }
  return L.outs.map(o=>val(o.src));
}
function combos(L){
  const n=L.inputs.length,rows=[];
  for(let i=0;i<(1<<n);i++){const v={};L.inputs.forEach((nm,k)=>v[nm]=(i>>(n-1-k))&1);rows.push(v);}
  return rows;
}
function layout(L){
  const maxCol=Math.max(...L.gates.map(g=>g.col));
  const H=340,pos={};
  const ypos=(i,n)=>H*(i+1)/(n+1);
  L.inputs.forEach((nm,i)=>pos[nm]={x:80,y:ypos(i,L.inputs.length),kind:'in'});
  for(let c=1;c<=maxCol;c++){
    const gs=L.gates.filter(g=>g.col===c);
    gs.forEach((g,i)=>pos[g.id]={x:230+(c-1)*190,y:ypos(i,gs.length),kind:'gate'});
  }
  const ox=230+(maxCol-1)*190+170;
  L.outs.forEach((o,i)=>pos['out'+i]={x:ox,y:ypos(i,L.outs.length),kind:'out'});
  return{pos,W:ox+110,H};
}

function svgFor(L){
  const {pos,W,H}=layout(L);
  const vals=Object.assign({},sw);
  const memo=Object.assign({},vals);
  function val(id){
    if(id in memo)return memo[id];
    const g=L.gates.find(x=>x.id===id),c=choice[id];
    return memo[id]=c?GATES[c](val(g.ins[0]),val(g.ins[1])):0;
  }
  const col=v=>v?'#34d399':'#475569';
  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  const wire=(a,b,v)=>'<path d="M'+a.x+' '+a.y+' C'+(a.x+50)+' '+a.y+' '+(b.x-50)+' '+b.y+' '+b.x+' '+b.y+'" fill="none" stroke="'+col(v)+'" stroke-width="4" stroke-linecap="round"/>';
  L.gates.forEach(g=>{
    const p=pos[g.id];
    g.ins.forEach((src,k)=>{
      const sp=pos[src];const from={x:sp.x+(sp.kind==='in'?18:45),y:sp.y};
      s+=wire(from,{x:p.x-45,y:p.y+(k?13:-13)},val(src));
    });
  });
  L.outs.forEach((o,i)=>{const p=pos['out'+i],sp=pos[o.src];s+=wire({x:sp.x+45,y:sp.y},{x:p.x-18,y:p.y},val(o.src));});
  L.inputs.forEach(nm=>{
    const p=pos[nm],v=sw[nm];
    s+='<g class="inp" data-in="'+nm+'"><text x="'+(p.x-30)+'" y="'+(p.y+6)+'" text-anchor="end" fill="#e8eef9" font-size="20" font-weight="700">'+nm+'</text>'+
       '<circle cx="'+p.x+'" cy="'+p.y+'" r="18" fill="'+(v?'#34d399':'#1d2c4a')+'" stroke="'+(v?'#a7f3d0':'#475569')+'" stroke-width="3"/>'+
       '<text x="'+p.x+'" y="'+(p.y+7)+'" text-anchor="middle" font-size="20" font-weight="800" fill="'+(v?'#04261b':'#8fa1c0')+'">'+v+'</text></g>';
  });
  L.gates.forEach(g=>{
    const p=pos[g.id],c=choice[g.id],v=val(g.id);
    s+='<g class="gate" data-g="'+g.id+'"><rect x="'+(p.x-45)+'" y="'+(p.y-27)+'" width="90" height="54" rx="10" fill="'+(c?'#1d2c4a':'#2a1f10')+'" stroke="'+(c?col(v):'#fbbf24')+'" stroke-width="3" '+(c?'':'stroke-dasharray="6 5"')+'/>'+
       '<text x="'+p.x+'" y="'+(p.y+7)+'" text-anchor="middle" font-size="'+(c?'20':'26')+'" font-weight="800" fill="'+(c?'#e8eef9':'#fbbf24')+'">'+(c||'?')+'</text></g>';
  });
  L.outs.forEach((o,i)=>{
    const p=pos['out'+i],v=val(o.src);
    s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="18" fill="'+(v?'#fbbf24':'#1d2c4a')+'" stroke="'+(v?'#fde68a':'#475569')+'" stroke-width="3"/>'+
       '<text x="'+p.x+'" y="'+(p.y+7)+'" text-anchor="middle" font-size="20" font-weight="800" fill="'+(v?'#3b2a00':'#8fa1c0')+'">'+v+'</text>'+
       '<text x="'+(p.x+28)+'" y="'+(p.y+6)+'" fill="#e8eef9" font-size="19" font-weight="700">'+o.label+'</text>';
  });
  return s+'</svg>';
}
let checked=false,checkMsg='',checkBad=false;
function tableFor(L){
  const rows=combos(L);
  let h='<table><tr>'+L.inputs.map(n=>'<th>'+n+'</th>').join('')+L.outs.map(o=>'<th>want '+o.label+'</th>').join('')+L.outs.map(o=>'<th>your '+o.label+'</th>').join('')+'<th></th></tr>';
  let all=true,nOk=0;
  const allChosen=L.gates.every(g=>choice[g.id]);
  rows.forEach(v=>{
    const want=L.target(v).map(x=>x?1:0),got=evalNet(L,v,choice);
    const ok=want.every((x,i)=>x===got[i]);if(!ok)all=false;else nOk++;
    const cur=L.inputs.every(n=>sw[n]===v[n]);
    h+='<tr'+(cur?' class="cur"':'')+'>'+L.inputs.map(n=>'<td>'+v[n]+'</td>').join('')+want.map(x=>'<td>'+x+'</td>').join('')+got.map((x,i)=>'<td class="'+(checked?(want[i]===x?'ok':'no'):'')+'">'+(checked?x:'–')+'</td>').join('')+'<td class="'+(checked&&ok?'ok':'no')+'">'+(checked?(ok?'✓':'✗'):'')+'</td></tr>';
  });
  return{html:h+'</table>',solved:all&&allChosen,allChosen,nOk,total:rows.length};
}

function render(){
  const g=$('game');
  if(lv>=LEVELS.length){
    g.innerHTML='<div class="card win"><h2>🏆 All six circuits built!</h2><p style="font-size:22px">You’ve just designed a full adder from logic gates — the heart of a CPU’s arithmetic unit. Show a member of staff your screen to claim your prize.</p><button id="again" style="font-size:20px;background:var(--acc);color:#04261b">Play again</button></div>';
    $('again').onclick=()=>{lv=0;newLevel();};return;
  }
  const L=LEVELS[lv];
  let dots='';LEVELS.forEach((_,i)=>dots+='<div class="dot '+(i<lv?'done':i===lv?'cur':'')+'"></div>');
  const t=tableFor(L);
  g.innerHTML='<div class="card"><div class="dots">'+dots+'</div><div class="lvl">Level '+(lv+1)+' of '+LEVELS.length+' · '+L.title+'</div><div class="story">'+L.story+'</div>'+
    '<div class="how">Click a <span style="color:var(--acc2)">gate</span> to cycle through the gate types ('+OPTS.join(' → ')+'). Click an <b>input</b> to flick it between 0 and 1.</div></div>'+
    '<div class="card">'+svgFor(L)+'<div class="msg'+(checkMsg?(checkBad?' bad':' good'):'')+'" id="msg">'+checkMsg+'</div></div>'+
    '<div class="card"><b>Truth table</b> <span class="legend">— your circuit must match <i>every</i> row. The highlighted row is your current switch settings.</span><div style="overflow-x:auto">'+t.html+'</div>'+
    '<div class="row"><button id="checkBtn" style="background:var(--acc);color:#04261b;font-size:19px">✔ Check my answer</button><button id="hintBtn">💡 Hint</button><button id="restart">↺ Start again</button></div><div class="hint" id="hint">'+(hintOn?'💡 '+L.hint:'')+'</div></div>';
  g.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{
    if(locked)return;const id=el.dataset.g,c=choice[id];
    choice[id]=OPTS[(c?OPTS.indexOf(c)+1:0)%OPTS.length];checked=false;checkMsg='';render();
  });
  g.querySelectorAll('[data-in]').forEach(el=>el.onclick=()=>{if(locked)return;const n=el.dataset.in;sw[n]=1-sw[n];render();});
  $('hintBtn').onclick=()=>{hintOn=true;$('hint').textContent='💡 '+L.hint;};
  let armed=false;
  $('restart').onclick=()=>{
    if(!armed){armed=true;$('restart').textContent='Sure? Click again to restart from Level 1';armedT=setTimeout(()=>{armed=false;const r=$('restart');if(r)r.textContent='↺ Start again';},4000);}
    else{clearTimeout(armedT);lv=0;newLevel();}
  };
  $('checkBtn').onclick=()=>{
    if(locked)return;
    if(!t.allChosen){checked=false;checkBad=true;checkMsg='Pick a gate for every box first (click each box).';render();return;}
    checked=true;
    if(t.solved){locked=true;checkBad=false;checkMsg='🎉 Circuit complete! Every row matches.';render();setTimeout(()=>{lv++;newLevel();},2200);}
    else{checkBad=true;checkMsg='Not quite — '+t.nOk+' of '+t.total+' rows match. Look for the ✗ rows and think about which gate is wrong.';render();}
  };
}
function newLevel(){
  locked=false;hintOn=false;choice={};sw={};checked=false;checkMsg='';checkBad=false;
  if(lv<LEVELS.length)LEVELS[lv].inputs.forEach(n=>sw[n]=0);
  render();
}

/* reset after 3 idle minutes so the next visitor starts fresh */
let idle;function bump(){clearTimeout(idle);idle=setTimeout(()=>{lv=0;newLevel();},180000);}
['keydown','mousedown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,bump,{passive:true}));
newLevel();bump();
</script>
<!--OEB-->
<script>window.OEB_CFG={id:"logic",type:"time"};</script>
<script>(function(){
var C=window.OEB_CFG||{};if(!C.id)return;
var KEY='oeb:'+C.id,BAD=['ASS','SEX','FUK','FCK','FUC','CUM','TIT','WTF','KKK','NZI','SHT','DIK','DCK','PIS','CNT','FAG','JEW'];
var mem=[];
function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(v))return v;}catch(e){}return mem;}
function save(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
function fmt(t){var m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s;}
function rank(a){return a.slice().sort(function(x,y){return C.type==='score'?((y.s-x.s)||(x.t-y.t)):(x.t-y.t);});}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
var st=document.createElement('style');
st.textContent='#oeboard{max-width:1200px;margin:6px auto 26px;padding:14px 20px;background:var(--panel,#161f33);border:2px solid var(--acc2,#fbbf24);border-radius:14px;color:var(--ink,#e8eef9);font-family:system-ui,sans-serif}#oeboard h3{margin:0 0 8px;font-size:22px;color:var(--acc2,#fbbf24);user-select:none}#oeboard ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}#oeboard li{background:#0f1a30;border:1px solid var(--line,#2b3a57);border-radius:10px;padding:8px 12px;font-size:20px;font-weight:700;font-family:ui-monospace,Consolas,monospace}#oeboard li small{color:var(--mute,#8fa1c0);font-weight:500;font-size:15px}#oeboard li.me{border-color:var(--good,#34d399);background:#14463a}#oeboard .none{color:var(--mute,#8fa1c0);font-size:18px}#oeboard .clr{margin-top:10px;font-size:14px;opacity:.7;background:#4a1f26;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}.oeb-entry{margin:18px auto 4px;max-width:560px;background:#0f1a30;border:2px solid var(--acc2,#fbbf24);border-radius:14px;padding:14px 18px;font-size:20px;line-height:1.5}.oeb-entry input{font:700 28px ui-monospace,Consolas,monospace;width:110px;text-align:center;text-transform:uppercase;letter-spacing:.2em;border-radius:10px;border:2px solid var(--line,#2b3a57);background:#161f33;color:#fff;padding:6px}.oeb-entry button{font:inherit;font-weight:700;background:var(--acc2,#fbbf24);color:#1a1200;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;margin-left:6px}.oeb-entry .err{color:var(--bad,#f87171);font-size:17px;min-height:22px}';
document.head.appendChild(st);
var t0=null,saved=false;
function touch(){if(t0===null)t0=Date.now();}
['mousedown','keydown','touchstart'].forEach(function(e){document.addEventListener(e,touch,true);});
document.addEventListener('click',function(e){var b=e.target;if(b&&b.id==='restart'&&/^Sure/.test(b.textContent))t0=null;},true);
var idle;function idleReset(){clearTimeout(idle);idle=setTimeout(function(){t0=null;},180000);}
['mousedown','keydown','mousemove','touchstart'].forEach(function(e){document.addEventListener(e,idleReset,{passive:true});});
var panel=document.createElement('div');panel.id='oeboard';
var ref=document.querySelector('main');(ref&&ref.parentNode?ref.parentNode:document.body).insertBefore(panel,ref?ref.nextSibling:null);
var mine=null,clrShown=false,armed=false;
function renderBoard(){
  var a=rank(load()).slice(0,5);
  var h='<h3 id="oebh">🏆 Top 5 on this PC today — can you beat them?</h3>';
  if(!a.length)h+='<div class="none">No scores yet. Be the first on the board!</div>';
  else h+='<ol>'+a.map(function(x,i){return '<li'+(mine&&x.id===mine?' class="me"':'')+'>'+(['🥇','🥈','🥉','4.','5.'][i])+' '+esc(x.i)+' <small>'+(C.type==='score'?x.s+'/'+C.max+' · ':'')+fmt(x.t)+'</small></li>';}).join('')+'</ol>';
  if(clrShown)h+='<button class="clr" id="oebclr">Staff: clear this board</button>';
  panel.innerHTML=h;
  var hd=document.getElementById('oebh');if(hd)hd.ondblclick=function(){clrShown=true;renderBoard();};
  var c=document.getElementById('oebclr');
  if(c)c.onclick=function(){if(!armed){armed=true;c.textContent='Sure? Click again to delete ALL scores';setTimeout(function(){armed=false;clrShown=false;renderBoard();},4000);}else{save([]);armed=false;clrShown=false;mine=null;renderBoard();}};
}
function attach(w){
  if(w.getAttribute('data-oeb'))return;w.setAttribute('data-oeb','1');
  if(t0===null)t0=Date.now();
  var secs=Math.max(1,Math.round((Date.now()-t0)/1000)),sc=0;
  if(C.type==='score'){try{sc=C.getScore();}catch(e){sc=0;}}
  saved=false;
  var d=document.createElement('div');d.className='oeb-entry';
  d.innerHTML='<div>⏱ Your time: <b>'+fmt(secs)+'</b>'+(C.type==='score'?' · Score: <b>'+sc+'/'+C.max+'</b>':'')+'</div><div style="margin-top:8px">Add your <b>initials</b> to the leaderboard:<br><input id="oebin" maxlength="3" autocomplete="off" spellcheck="false"><button id="oebsave">Save</button></div><div class="err" id="oebe"></div>';
  w.appendChild(d);
  var inp=d.querySelector('#oebin'),go=d.querySelector('#oebsave'),er=d.querySelector('#oebe');
  inp.oninput=function(){inp.value=inp.value.replace(/[^a-zA-Z]/g,'').toUpperCase();};
  function doSave(){
    var v=inp.value.toUpperCase();
    if(!/^[A-Z]{2,3}$/.test(v)){er.textContent='Please enter 2 or 3 letters (initials only).';return;}
    if(BAD.indexOf(v)>-1){er.textContent='Please choose different initials.';return;}
    var a=load().slice();var id=Date.now()+'-'+Math.random().toString(36).slice(2,6);
    a.push({i:v,s:sc,t:secs,id:id});a=rank(a).slice(0,30);save(a);mine=id;saved=true;
    var pos=rank(a).findIndex(function(x){return x.id===id;})+1;
    d.innerHTML='<div style="font-size:24px">✅ Saved! You are <b>#'+pos+'</b> on the board today.</div><div class="mute" style="font-size:17px;margin-top:4px">Tell a friend to come and beat you!</div>';
    renderBoard();
  }
  go.onclick=doSave;inp.onkeydown=function(e){if(e.key==='Enter')doSave();};
  setTimeout(function(){try{inp.focus();}catch(e){}},50);
}
var mo=new MutationObserver(function(){var w=document.querySelector('.win,.end');if(w)attach(w);});
mo.observe(document.body,{childList:true,subtree:true});
