<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Graveney School Key Stage 3 Computing curriculum plan, Years 7 to 9 — 18 units with National Curriculum coverage, thread mapping and progression to OCR J277.">
<style>
  /* baseline reset — matches what the artifact host supplies */
  :root{color-scheme:light dark}
  html{-webkit-text-size-adjust:100%}
  body{margin:0}
  img{max-width:100%;height:auto}
  [hidden]{display:none!important}
</style>
<title>Graveney KS3 Computing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
:root{
  --teal:#0F7A78; --teal-deep:#0A5D5C; --navy:#1B2A4A; --cream:#F6F1E3;
  --ground:#FBF9F4;            /* warm neutral, biased to the cream */
  --surface:#FFFFFF;
  --surface-2:#F3EFE5;
  --ink:#1C2433;
  --ink-2:#4A5468;
  --ink-3:#7A8496;
  --rule:#E2DCCC;
  --rule-soft:#EDE8DA;
  --accent:var(--teal);
  --accent-ink:#0A5D5C;
  --chip:#E7F0EF;
  --flag-bg:#FDF3E0; --flag-rule:#C98A1E; --flag-ink:#7A5310;
  --shadow:0 1px 2px rgba(27,42,74,.05), 0 8px 24px -16px rgba(27,42,74,.18);

  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --maxw:1180px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --teal:#4FC3BE; --teal-deep:#7FD8D3; --navy:#0C1322; --cream:#1A2133;
    --ground:#0C1220; --surface:#141C2D; --surface-2:#1A2334;
    --ink:#E9EDF5; --ink-2:#AFBACB; --ink-3:#7C8899;
    --rule:#273245; --rule-soft:#1E2839;
    --accent:#4FC3BE; --accent-ink:#7FD8D3; --chip:#16302F;
    --flag-bg:#2A2011; --flag-rule:#B58136; --flag-ink:#E8C68A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --teal:#4FC3BE; --teal-deep:#7FD8D3; --navy:#0C1322; --cream:#1A2133;
  --ground:#0C1220; --surface:#141C2D; --surface-2:#1A2334;
  --ink:#E9EDF5; --ink-2:#AFBACB; --ink-3:#7C8899;
  --rule:#273245; --rule-soft:#1E2839;
  --accent:#4FC3BE; --accent-ink:#7FD8D3; --chip:#16302F;
  --flag-bg:#2A2011; --flag-rule:#B58136; --flag-ink:#E8C68A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); text-wrap:balance; margin:0; line-height:1.22; color:var(--ink)}
p{margin:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

.wrap{max-width:var(--maxw); margin:0 auto; padding-inline:20px}

/* ---------- masthead ---------- */
.mast{border-bottom:1px solid var(--rule); background:var(--surface)}
.mast .wrap{padding-block:40px 34px}
.eyebrow{
  font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent-ink); margin-bottom:14px;
}
.mast h1{font-size:clamp(30px,5.2vw,46px); font-weight:700; letter-spacing:-.015em}
.mast .sub{font-family:var(--display); font-size:clamp(17px,2.4vw,21px); color:var(--accent-ink); margin-top:6px}
.mast .meta{
  display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:22px; padding-top:18px;
  border-top:1px solid var(--rule-soft); font-size:13.5px; color:var(--ink-3);
}
.mast .meta b{font-weight:600; color:var(--ink-2)}

/* ---------- layout ---------- */
.shell{display:grid; grid-template-columns:216px minmax(0,1fr); gap:44px; align-items:start}
.shell > .wrap{padding-inline:0}
.page{max-width:var(--maxw); margin:0 auto; padding-inline:20px; padding-block:0 72px}

nav.toc{position:sticky; top:0; max-height:100vh; overflow-y:auto; padding-block:34px 24px}
nav.toc .grp{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:20px 0 8px;
}
nav.toc .grp:first-child{margin-top:0}
nav.toc a{
  display:block; padding:4px 0 4px 11px; font-size:13.5px; line-height:1.4;
  color:var(--ink-2); text-decoration:none; border-left:2px solid var(--rule);
}
nav.toc a:hover{color:var(--accent-ink); border-left-color:var(--accent)}
nav.toc a.on{color:var(--accent-ink); font-weight:600; border-left-color:var(--accent)}
nav.toc a .c{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-right:6px}

main section{scroll-margin-top:22px; padding-block:38px 0}
main section + section{border-top:1px solid var(--rule-soft)}
h2.sec{font-size:clamp(23px,3.2vw,30px); font-weight:700; letter-spacing:-.012em; margin-bottom:6px}
.sec-note{color:var(--ink-2); max-width:66ch; margin-top:12px}
.sec-note + .sec-note{margin-top:11px}
h3.sub{font-size:19px; font-weight:600; margin-top:30px; margin-bottom:8px}
.prose{max-width:66ch}
.prose p + p{margin-top:11px}

/* ---------- principle / intent list ---------- */
.defs{display:grid; gap:0; margin-top:22px; border-top:1px solid var(--rule-soft)}
.defs > div{
  display:grid; grid-template-columns:minmax(0,15rem) minmax(0,1fr); gap:12px 32px;
  padding-block:18px; border-bottom:1px solid var(--rule-soft);
}
.defs dt, .defs h4{font-family:var(--display); font-size:16.5px; font-weight:600; color:var(--accent-ink)}
.defs p{color:var(--ink-2); font-size:15.5px}

/* ---------- overview grid ---------- */
.grid-ov{
  display:grid; grid-template-columns:78px repeat(3,minmax(0,1fr)); gap:1px;
  background:var(--rule); border:1px solid var(--rule); margin-top:24px;
  border-radius:4px; overflow:hidden;
}
.grid-ov > *{background:var(--surface); padding:11px 13px}
.grid-ov .hd{
  background:var(--navy); color:#fff; font-family:var(--mono); font-size:11px;
  font-weight:600; letter-spacing:.11em; text-transform:uppercase; padding-block:10px;
}
:root[data-theme="dark"] .grid-ov .hd, :root:not([data-theme="light"]) .grid-ov .hd{background:var(--surface-2); color:var(--ink)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .grid-ov .hd{background:var(--navy); color:#fff}}
.grid-ov .term{
  background:var(--surface-2); font-family:var(--mono); font-size:10.5px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); display:flex; align-items:center;
}
.grid-ov .cell a{
  display:block; text-decoration:none; font-size:14px; font-weight:600; line-height:1.32; color:var(--ink);
}
.grid-ov .cell a:hover{color:var(--accent-ink)}
.grid-ov .cell .code{font-family:var(--mono); font-size:11.5px; color:var(--accent-ink); margin-right:5px}
.grid-ov .cell .th{font-size:11px; color:var(--ink-3); margin-top:5px; line-height:1.35}

/* ---------- thread weave matrix ---------- */
.weave-scroll{overflow-x:auto; margin-top:22px; padding-bottom:4px}
table.weave{border-collapse:separate; border-spacing:0; font-size:12px; min-width:640px}
table.weave th, table.weave td{padding:0; text-align:center}
table.weave th.rowhd{
  text-align:left; font-family:var(--body); font-size:13px; font-weight:500; color:var(--ink-2);
  padding:0 14px 0 0; white-space:nowrap; position:sticky; left:0; background:var(--ground);
}
table.weave td.u{width:30px; height:26px}
table.weave .dot{
  width:13px; height:13px; border-radius:50%; margin:0 auto;
  background:var(--rule); display:block;
}
table.weave .dot.on{background:var(--accent); box-shadow:0 0 0 3px var(--chip)}
table.weave th.colhd{
  font-family:var(--mono); font-size:10px; font-weight:600; color:var(--ink-3);
  padding-bottom:8px; width:30px; letter-spacing:0;
}
table.weave tr.yrhd th{
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.13em;
  text-transform:uppercase; color:var(--accent-ink); padding-bottom:4px; text-align:center;
}
table.weave tbody tr:hover th.rowhd{color:var(--accent-ink)}
table.weave td.sep{width:12px}

/* ---------- coverage tables ---------- */
.tbl-scroll{overflow-x:auto; margin-top:22px}
table.data{border-collapse:collapse; width:100%; min-width:560px; font-size:14.5px}
table.data th, table.data td{text-align:left; vertical-align:top; padding:11px 14px; border-bottom:1px solid var(--rule-soft)}
table.data thead th{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); border-bottom:1px solid var(--rule);
}
table.data td.n{font-family:var(--mono); font-weight:600; color:var(--accent-ink); white-space:nowrap; width:1%}
table.data td.refs{font-family:var(--mono); font-size:12.5px; font-weight:500; color:var(--ink-2); white-space:nowrap; width:1%}
table.data td.refs.gap{font-family:var(--body); font-style:italic; font-weight:400; color:var(--ink-3); white-space:normal}
table.data tbody tr:hover{background:var(--surface-2)}

/* ---------- unit entries ---------- */
.yearbar{
  display:flex; align-items:baseline; gap:14px; margin-top:34px; padding-bottom:9px;
  border-bottom:2px solid var(--accent);
}
.yearbar h3{font-size:22px; font-weight:700}
.yearbar span{font-family:var(--mono); font-size:11.5px; color:var(--ink-3)}

article.unit{padding-block:30px; border-bottom:1px solid var(--rule-soft)}
article.unit > header{margin-bottom:16px}
.unit h4{font-size:21px; font-weight:600; letter-spacing:-.008em}
.unit h4 .code{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--accent-ink); margin-right:9px}
.unit .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center}
.pill{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  color:var(--accent-ink); background:var(--chip); padding:3px 8px; border-radius:3px;
  white-space:nowrap; max-width:100%; overflow-wrap:anywhere;
}
.pill.plain{background:transparent; color:var(--ink-3); padding-left:0}
.j277 .codes .pill{white-space:normal; line-height:1.5}

.flag{
  background:var(--flag-bg); border-left:3px solid var(--flag-rule); color:var(--flag-ink);
  padding:10px 14px; font-size:13.5px; font-weight:500; margin-block:14px; border-radius:0 3px 3px 0;
}

.fields{display:grid; gap:18px; margin-top:4px}
.field > .lbl{
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.15em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:6px;
}
.field p, .field li{font-size:15px; color:var(--ink-2)}
.field .prose p{max-width:66ch}

ol.lessons{margin:0; padding:0; list-style:none; counter-reset:l; display:grid; gap:1px; background:var(--rule-soft); border:1px solid var(--rule-soft); border-radius:4px; overflow:hidden}
ol.lessons li{
  counter-increment:l; background:var(--surface); padding:8px 13px 8px 40px; position:relative;
  font-size:14.5px; color:var(--ink);
}
ol.lessons li::before{
  content:counter(l); position:absolute; left:0; top:0; bottom:0; width:30px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--accent-ink); background:var(--surface-2);
}
ul.plain{margin:0; padding-left:18px}
ul.plain li{margin-bottom:4px}
ul.plain::marker{color:var(--accent)}

.vocab{display:flex; flex-wrap:wrap; gap:5px}
.vocab span{
  font-size:12.5px; color:var(--ink-2); background:var(--surface-2);
  padding:2.5px 8px; border-radius:3px; border:1px solid var(--rule-soft);
}
.nclist{display:grid; gap:9px}
.nclist > div{display:grid; grid-template-columns:22px minmax(0,1fr); gap:10px; align-items:start}
.nclist .n{font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--accent-ink); padding-top:1px}
.nclist p{font-size:14px; color:var(--ink-2)}
.j277 .codes{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px}

.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:18px}

/* ---------- thread appendix ---------- */
.threadcard{padding-block:20px; border-bottom:1px solid var(--rule-soft)}
.threadcard h4{font-size:17px; font-weight:600}
.threadcard .desc{font-size:14.5px; color:var(--ink-3); margin-top:4px; max-width:66ch}
.threadcard .chain{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; align-items:center}
.threadcard .chain a{
  font-size:13px; text-decoration:none; color:var(--ink); background:var(--surface);
  border:1px solid var(--rule); padding:4px 9px; border-radius:3px;
}
.threadcard .chain a:hover{border-color:var(--accent); color:var(--accent-ink)}
.threadcard .chain a .c{font-family:var(--mono); font-size:11px; color:var(--accent-ink); margin-right:5px}
.threadcard .chain .arrow{color:var(--ink-3); font-size:12px}

/* ---------- sources / foot ---------- */
.src{display:grid; gap:16px; margin-top:20px}
.src > div{padding-left:13px; border-left:2px solid var(--rule)}
.src b{font-weight:600; display:block; font-size:15px}
.src span{font-size:13.5px; color:var(--ink-3); display:block; margin-block:2px 4px}
.src a{font-size:13px; word-break:break-all}
footer.foot{margin-top:44px; padding-top:20px; border-top:1px solid var(--rule); font-size:13px; color:var(--ink-3)}

/* ---------- responsive ---------- */
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr); gap:0}
  nav.toc{position:static; max-height:none; padding-block:22px 0; border-bottom:1px solid var(--rule-soft)}
  nav.toc .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:2px 22px}
  .defs > div{grid-template-columns:minmax(0,1fr); gap:5px}
  .grid-ov{grid-template-columns:64px repeat(3,minmax(0,1fr)); font-size:13px}
  .grid-ov > *{padding:9px 9px}
  .grid-ov .cell a{font-size:12.5px}
}
@media (max-width:560px){
  .grid-ov{grid-template-columns:minmax(0,1fr)}
  .grid-ov .hd{display:none}
  .grid-ov .term{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<script type="application/json" id="data">{
 "school": "Graveney School",
 "title": "Key Stage 3 Computing Curriculum Plan",
 "subtitle": "Years 7 to 9",
 "year": "2026 to 2027",
 "authorRole": "Key Stage 3 Coordinator, Computer Science",
 "palette": {

 },
 "intent": [
  [
   "Why we teach computing",
   "Every pupil at Graveney leaves Key Stage 3 having been taught to understand the technology that shapes their life, not merely to operate it. Our curriculum treats computing as a discipline with its own body of knowledge — how data is represented, how networks move it, how programs transform it, and how the people who build these systems make choices that affect everyone else. Pupils who go on to study GCSE Computer Science arrive with that knowledge secure. Pupils who do not go on to study it leave with an informed, critical and confident relationship with digital technology that will serve them whatever they do next."
  ],
  [
   "What we want pupils to be able to do",
   "By the end of Year 9 a Graveney pupil can read and write programs in both a block-based and a text-based language; explain how text, numbers, images and sound are represented in binary and calculate the consequences for file size; describe how data travels across a network and what threatens it; plan, build and evaluate a digital artefact for a real audience; and reason about the social, legal and ethical consequences of a technology rather than simply reacting to it."
  ],
  [
   "Ambition for all",
   "The curriculum is taught to mixed-ability groups without setting or tiering. Scaffolding is built into the resources rather than into the curriculum: where pupils need more support they receive word banks, sentence starters, partially completed trace tables and hint boxes that guide reasoning without supplying the answer. The content itself is not reduced."
  ]
 ],
 "principles": [
  [
   "Knowledge before application",
   "Pupils are taught the substantive knowledge a task requires before being asked to perform the task. Vocabulary is introduced explicitly, defined, and revisited. Every unit carries a defined set of key terms that appear in teaching, in homework and in the end-of-unit assessment."
  ],
  [
   "Sequenced so that knowledge compounds",
   "Units are ordered so that each draws on what came before. Block-based programming in Year 7 precedes text-based programming in Year 8, which precedes data structures in Year 9. Binary number representation in Year 8 precedes image and sound representation in Year 9. The order in this document is the order of delivery, and the prior knowledge stated for each unit is knowledge pupils have genuinely been taught here."
  ],
  [
   "Buffer-first planning",
   "Units are six lessons long and sit inside seven-week half-terms. The spare week is deliberate. It absorbs trips, assemblies, snow days, fire drills and the lessons that simply take longer than planned, so that teachers are not forced to cut content to stay on schedule."
  ],
  [
   "Merge rather than cut",
   "Where a unit has to be shortened, related topics are combined into a single lesson rather than dropped. Coverage is protected; time is found by tightening, not by omission."
  ],
  [
   "Equity by default",
   "We assume that some pupils do not have a reliable device or internet connection at home. Homework is designed to be completable on paper. Where a task benefits from a device, that part of the task is optional and clearly marked as such, and it is never the part that carries the assessed knowledge."
  ],
  [
   "Assessment that informs teaching",
   "Every unit ends with an assessment that reports on the knowledge specified for that unit, not on generic computing ability. Assessments are auto-marked wherever the question type allows, so that teacher time goes into responding to what the results show rather than into marking."
  ],
  [
   "Resources that are ready to teach",
   "Planning documents are accompanied by finished materials — slides with speaker notes, worksheets, homework booklets, mark schemes and assessments. A teacher picking up a unit should not have to build it first."
  ]
 ],
 "threadsIntro": "We use threads to signpost groups of units that link to one another and that together build a common body of knowledge over time. The term is deliberately visual: a thread weaves through the curriculum, appearing, disappearing and reappearing, each time carrying a little more than it did before.\n\nOur eleven threads are shared with the Oak National Academy computing curriculum, from which much of our unit content is drawn. Using a common set of threads means that pupils arriving from primary schools that follow the same scheme meet familiar territory, and that our Key Stage 3 sequence connects cleanly to Key Stage 4.",
 "threads": [
  [
   "Algorithms and data structures",
   "Expressing a solution as a precise sequence of steps, and choosing how to organise the data that solution works on."
  ],
  [

  [

  ],
  [

  ],
  [

  ],
  [

  ],
  [

  ],
  [

  ],
  [
   "Safety and security",
   "Using technology safely and responsibly, and protecting data, devices and people from threats."
  ]
 ],
 "delivery": "Key Stage 3 Computing at Graveney is taught in one 60-minute lesson per week to mixed-ability groups across Years 7, 8 and 9.\n\nEach year comprises six units of six lessons, giving 36 taught lessons per year and 108 across the key stage. Each unit occupies one half-term of a seven-week cycle, leaving one week of slack per half-term as described under buffer-first planning above.\n\nThe final lesson of most units is an assessment lesson rather than a teaching lesson. Where a unit's sixth lesson carries new content, that content is compressed into the first part of the lesson and the assessment follows.\n\nAll work is set, collected and returned through Google Classroom, and the school uses Google Workspace throughout. Assessments are delivered as Google Forms in quiz mode, generated programmatically so that they can be rebuilt or amended without manual re-entry.",
 "assessment": "Assessment at Key Stage 3 serves two purposes: to tell the teacher what pupils have retained, and to tell pupils what they know.\n\nEach unit ends with a summative assessment reporting against that unit's specified knowledge and vocabulary. Question types are chosen to match what is being assessed — multiple choice and short answer where recall is the target, trace tables and debugging tasks where program comprehension is the target, and extended response where reasoning about impact is the target. Where a unit's outcome is a made artefact — a website, an app, an animation, a physical computing project — it is assessed against an analytic rubric with defined performance levels rather than by a written test.\n\nAuto-marked questions are released to pupils only after teacher review, so that results can be looked at as a class picture before individual grades are seen.\n\nHomework is retrieval-focused. Tasks reinforce the current lesson and lightly recap the previous one, run to about 30 minutes, and follow a consistent structure within a unit so that pupils know what to expect. Every homework booklet carries a teacher answer key or mark scheme.",
 "ks4Intro": "Our Key Stage 3 curriculum is not a GCSE course delivered early, and Year 9 is not a GCSE taster year. Pupils at Graveney choose their options at the end of Year 9, and a curriculum that narrowed towards Computer Science before that point would serve the majority of pupils badly.\n\nWhat the curriculum does instead is build, across all three years, the knowledge that OCR J277 later assumes. The table below shows which J277 topic each unit feeds. The connections are spread deliberately across Years 7 to 9 rather than concentrated at the end.",
 "ks4Boundaries": "Two areas of the J277 specification are approached differently at Key Stage 3, and we set them out here so that the boundary reads as a decision rather than an oversight.\n\n**Computer systems is distributed, not taught as a unit.** We do not run a dedicated computer systems unit. The underlying ideas are nonetheless met in context across the key stage: input, process and output, and programming a device rather than a screen, in the Year 7 micro:bit unit; network hardware — routers, switches, servers and clients — in the Year 7 networks unit; how data is actually stored and measured in the Year 8 and Year 9 data representation units; how devices and networks are protected in the Year 8 online safety and Year 9 cybersecurity units; and a trained model running on a physical device in the Year 9 machine learning unit. What is left to Year 10 is the formal treatment — the CPU and the fetch-execute cycle, and the operating system as systems software. The time this would take at Key Stage 3 is spent instead on programming fluency and data representation, which are harder to acquire late and which benefit every pupil regardless of option choice. Should we later wish to draw the strand together, it sits naturally alongside the micro:bit unit in Year 7 or the online safety unit in Year 8, where the operating system's role in protecting a device is already half the conversation.\n\n**Boolean logic is deliberately thin, and taught through programming.** Pupils meet Boolean reasoning in the form they can immediately use: operators and conditions in Scratch in Year 7, comparison and logical operators in Python in Year 8, and conditions governing iteration over data structures in Year 9. Spread across all three years, this meets the national curriculum requirement to understand simple Boolean logic and its uses in programming. Logic gates and truth tables — the form J277 examines under 2.4 — are taught in Year 10, by which point pupils already have the underlying reasoning and are learning a notation rather than an idea.",
 "howToUse": "This document sets out what is taught, in what order, and why. It is the reference point for curriculum conversations — with the department, with senior leaders, with governors and with external reviewers.\n\nIt is not a lesson plan. Each unit named here has its own medium-term plan and a full set of teaching resources held in the department's shared drive. Where this document lists the lessons in a unit, those are the lesson titles as they appear in those resources.\n\n**Reading a unit entry.** Each unit records the threads it belongs to, what the unit covers, why it sits at that point in the sequence, the lessons it contains, what pupils need to know before starting it, the National Curriculum statements it addresses, the J277 topics it feeds, its key vocabulary, and how it is assessed and supported by homework.\n\n**A note on sources.** Unit content is drawn from the Oak National Academy computing curriculum, developed with the Raspberry Pi Foundation, and adapted to Graveney's sequence, timetable and context. Unit 1 of Year 7 is written in school.",
 "ncIntro": "The national curriculum for computing at Key Stage 3 sets out nine statements of what pupils should be taught. All nine are addressed by this curriculum. The table below shows where each is met.",

     "Pupils can recognise and use variables and data structures in programs.",
     "Pupils can explain what computer systems are."
    ],
    "nc": [
     1,
     3,
     7
    ],
    "nc_text": {
     "1": "design, use and evaluate computational abstractions that model the state and behaviour of real-world problems and physical systems",
     "3": "use 2 or more programming languages, at least one of which is textual, to solve a variety of computational problems; make appropriate use of data structures [for example, lists, tables or arrays]; design and develop modular programs that use procedures or functions",
     "7": "undertake creative projects that involve selecting, using, and combining multiple applications, preferably across a range of devices, to achieve challenging goals, including collecting and analysing data and meeting the needs of known users"
    },
    "j277": [
     {
      "code": "1.1",
      "title": "Systems architecture"
     },
     {
      "code": "2.1",
      "title": "Algorithms"
     },
     {
      "code": "1.6",
      "title": "Ethical, legal, cultural and environmental impacts of digital technology"
     }
    ],
    "j277_note": "Closes KS3 by returning to the micro:bit from Year 7 with a model-building task, and gives pupils a concrete account of what machine learning actually is before they meet AI in 1.6.",
    "vocab": [
     "machine learning",
     "model",
     "training data",
     "testing data",
     "label",
     "feature",
     "classification",
     "accuracy",
     "overfitting",
     "bias",
     "evaluation",
     "data-driven application"
    ],
    "assessment": "Assessed on the data-driven application, its documentation and its evaluation.",
    "homework": "To be developed."
   }
  ]
 },
 "j277GapNote": {
  "1.5": "Formal treatment in Year 10 — see the boundary note below",
  "2.4": "Met through programming in 7.3, 8.4 and 9.3; gates and truth tables in Year 10"
 }
}</script>

<div class="mast">
  <div class="wrap">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="mtitle"></h1>
    <div class="sub" id="msub"></div>
    <div class="meta" id="mmeta"></div>
  </div>
</div>

<div class="page">
  <div class="shell">
    <nav class="toc" id="toc" aria-label="Contents"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
(function(){
  const B = JSON.parse(document.getElementById('data').textContent);
  const YEARS = ['Year 7','Year 8','Year 9'];
  const TERMS = ['Autumn 1','Autumn 2','Spring 1','Spring 2','Summer 1','Summer 2'];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const rich = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const paras = s => s.split('\n\n').map(t=>`<p>${rich(t)}</p>`).join('');
  const yn = y => y.slice(-1);
  const uid = (y,u) => `u${yn(y)}-${u.n}`;
  const allUnits = () => YEARS.flatMap(y => B.years[y].map(u => ({y,u})));

  // ---------- masthead ----------
  document.getElementById('eyebrow').textContent = B.school;
  document.getElementById('mtitle').textContent = B.title;
  document.getElementById('msub').textContent = B.subtitle;
  document.getElementById('mmeta').innerHTML = [
    `<span><b>${B.year}</b></span>`,
    `<span>${esc(B.authorRole)}</span>`,
    `<span><b>18</b> units · <b>108</b> lessons · one 60-minute lesson per week</span>`,
  ].join('');

  // ---------- sections ----------
  const S = [];
  const add = (id,label,html,group) => S.push({id,label,html,group});

  add('how','How to use this document', `<h2 class="sec">How to use this document</h2><div class="prose sec-note">${paras(B.howToUse)}</div>`,'Curriculum');

  add('intent','Curriculum intent',
    `<h2 class="sec">Curriculum intent</h2><div class="defs">` +
    B.intent.map(([t,b])=>`<div><h4>${esc(t)}</h4><div class="prose">${paras(b)}</div></div>`).join('') +
    `</div>`,'Curriculum');

  add('principles','Curriculum principles',
    `<h2 class="sec">Curriculum principles</h2><p class="sec-note">Seven principles govern the design of this curriculum. They are the reasons behind the decisions recorded in the rest of this document.</p><div class="defs">` +
    B.principles.map(([t,b])=>`<div><h4>${esc(t)}</h4><div class="prose">${paras(b)}</div></div>`).join('') +
    `</div>`,'Curriculum');

  // threads + weave matrix
  const units = allUnits();
  const weave = `<div class="weave-scroll"><table class="weave">
    <thead>
      <tr class="yrhd"><th class="rowhd"></th>${YEARS.map((y,i)=>`${i?'<th class="sep"></th>':''}<th colspan="6">${esc(y)}</th>`).join('')}</tr>
      <tr><th class="rowhd"></th>${YEARS.map((y,i)=>`${i?'<th class="sep"></th>':''}${B.years[y].map(u=>`<th class="colhd" title="${esc(u.title)}">${yn(y)}.${u.n}</th>`).join('')}`).join('')}</tr>
    </thead>
    <tbody>${B.threads.map(([name])=>`<tr><th class="rowhd">${esc(name)}</th>${
      YEARS.map((y,i)=>`${i?'<td class="sep"></td>':''}${B.years[y].map(u=>{
        const on=(u.threads||[]).includes(name);
        return `<td class="u"><span class="dot${on?' on':''}" title="${on?esc(yn(y)+'.'+u.n+' '+u.title):''}"></span></td>`;
      }).join('')}`).join('')
    }</tr>`).join('')}</tbody></table></div>`;

  add('threads','Threads',
    `<h2 class="sec">Threads</h2><div class="prose sec-note">${paras(B.threadsIntro)}</div>
     <h3 class="sub">How the threads weave through Key Stage 3</h3>
     <p class="sec-note">Each row is a thread; each column is a unit, in teaching order. A filled dot means that unit carries that thread.</p>
     ${weave}
     <h3 class="sub">What each thread covers</h3>
     <div class="defs">${B.threads.map(([n,d])=>`<div><h4>${esc(n)}</h4><p>${esc(d)}</p></div>`).join('')}</div>`,'Curriculum');

  add('delivery','Curriculum delivery',
    `<h2 class="sec">Curriculum delivery</h2><div class="prose sec-note">${paras(B.delivery)}</div>
     <h3 class="sub">Assessment and homework</h3><div class="prose sec-note">${paras(B.assessment)}</div>`,'Curriculum');

  // NC coverage
  const ncUnits = n => units.filter(({u})=>u.nc.includes(Number(n))).map(({y,u})=>`${yn(y)}.${u.n}`);
  add('nc','National Curriculum coverage',
    `<h2 class="sec">National Curriculum coverage</h2><p class="sec-note">${esc(B.ncIntro)}</p>
     <div class="tbl-scroll"><table class="data"><thead><tr><th></th><th>Pupils should be taught to…</th><th>Units</th></tr></thead>
     <tbody>${Object.keys(B.nc).map(k=>`<tr><td class="n">${k}</td><td>${esc(B.nc[k])}</td><td class="refs">${ncUnits(k).join(', ')}</td></tr>`).join('')}
     </tbody></table></div>
     <p class="sec-note" style="font-size:13.5px;color:var(--ink-3)">Unit references are given as year.unit — so 8.4 is Year 8, Unit 4.</p>`,'Curriculum');

  // KS4
  const jUnits = c => units.filter(({u})=>u.j277.some(x=>x.code===c)).map(({y,u})=>`${yn(y)}.${u.n}`);
  add('ks4','Progression to Key Stage 4',
    `<h2 class="sec">Progression to Key Stage 4</h2><div class="prose sec-note">${paras(B.ks4Intro)}</div>
     <h3 class="sub">J277 topic coverage across Key Stage 3</h3>
     <div class="tbl-scroll"><table class="data"><thead><tr><th></th><th>OCR J277 topic</th><th>Units that feed it</th></tr></thead>
     <tbody>${Object.keys(B.j277).map(c=>{const h=jUnits(c);
       const note=(B.j277GapNote||{})[c]||'Taught at Key Stage 4';
       return `<tr><td class="n">${c}</td><td>${esc(B.j277[c])}</td><td class="refs${h.length?'':' gap'}">${h.length?h.join(', '):esc(note)}</td></tr>`;
     }).join('')}</tbody></table></div>
     <h3 class="sub">Where the Key Stage 3 boundary sits</h3><div class="prose sec-note">${paras(B.ks4Boundaries)}</div>`,'Curriculum');

  // overview
  add('overview','Long-term overview',
    `<h2 class="sec">Long-term overview</h2><p class="sec-note">Eighteen units across three years, one per half-term. The order below is the order of delivery.</p>
     <div class="grid-ov">
       <div class="hd"></div>${YEARS.map(y=>`<div class="hd">${esc(y)}</div>`).join('')}
       ${TERMS.map((t,i)=>`<div class="term">${esc(t)}</div>` + YEARS.map(y=>{
          const u=B.years[y][i];
          return `<div class="cell"><a href="#${uid(y,u)}"><span class="code">${yn(y)}.${u.n}</span>${esc(u.title)}</a><div class="th">${(u.threads||['Threads to confirm']).join(' · ')}</div></div>`;
        }).join('')).join('')}
     </div>`,'Curriculum');

  // unit entries
  function unitHTML(y,u){
    const lessons = u.lessons||[];
    const f=[];
    if(u.description) f.push(`<div class="field"><div class="lbl">Unit description</div><div class="prose">${paras(u.description)}</div></div>`);
    if(u.why) f.push(`<div class="field"><div class="lbl">Why this, why now?</div><div class="prose">${paras(u.why)}</div></div>`);
    f.push(`<div class="field"><div class="lbl">Lessons in unit</div>${
      lessons.length ? `<ol class="lessons">${lessons.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>` : `<p style="font-style:italic;color:var(--ink-3)">To be confirmed.</p>`
    }${lessons.length>6?`<div class="flag">To confirm — the source unit runs ${lessons.length} lessons; Graveney teaches six. Confirm which six.</div>`:''}</div>`);
    if((u.prior||[]).length) f.push(`<div class="field"><div class="lbl">Prior knowledge requirements</div><ul class="plain">${u.prior.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`);
    f.push(`<div class="two">
      <div class="field"><div class="lbl">National Curriculum</div><div class="nclist">${
        u.nc.map(n=>`<div><span class="n">${n}</span><p>${esc(B.nc[String(n)])}</p></div>`).join('')}</div></div>
      <div class="field j277"><div class="lbl">Progression to GCSE (OCR J277)</div>
        <div class="codes">${u.j277.map(x=>`<span class="pill">${x.code} ${esc(x.title)}</span>`).join('')}</div>
        <p>${esc(u.j277_note)}</p></div>
    </div>`);
    f.push(`<div class="field"><div class="lbl">Key vocabulary</div><div class="vocab">${u.vocab.map(v=>`<span>${esc(v)}</span>`).join('')}</div></div>`);
    f.push(`<div class="two">
      <div class="field"><div class="lbl">Assessment</div><p>${esc(u.assessment)}</p></div>
      <div class="field"><div class="lbl">Homework</div><p>${esc(u.homework)}</p></div>
    </div>`);
    if(u.note) f.push(`<div class="field"><div class="lbl">Note</div><p>${esc(u.note)}</p></div>`);

    return `<article class="unit" id="${uid(y,u)}">
      <header>
        <h4><span class="code">${yn(y)}.${u.n}</span>${esc(u.title)}</h4>
        <div class="tags">
          <span class="pill plain">${esc(TERMS[u.n-1])}</span>
          <span class="pill plain">${lessons.length||6} lessons</span>
          ${(u.threads||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('') || '<span class="pill">Threads to confirm</span>'}
        </div>
      </header>
      ${!u.lessons?`<div class="flag">To complete — this unit is written in school and has no Oak source entry. Lesson titles, description and prior knowledge to be added.</div>`:''}
      <div class="fields">${f.join('')}</div>
    </article>`;
  }

  YEARS.forEach(y=>{
    add('y'+yn(y), y+' units',
      `<div class="yearbar"><h3>${esc(y)} units</h3><span>6 units · 36 lessons</span></div>` +
      B.years[y].map(u=>unitHTML(y,u)).join(''), 'Units');
  });

  // thread appendix
  add('threadmap','Threads in computing',
    `<h2 class="sec">Threads in computing</h2><p class="sec-note">Each thread below lists the units that carry it, in teaching order, so the development of a single idea across Key Stage 3 can be read in one place.</p>` +
    B.threads.map(([name,desc])=>{
      const hits = units.filter(({u})=>(u.threads||[]).includes(name));
      return `<div class="threadcard"><h4>${esc(name)}</h4><p class="desc">${esc(desc)}</p>
        <div class="chain">${hits.length
          ? hits.map(({y,u},i)=>`${i?'<span class="arrow">→</span>':''}<a href="#${uid(y,u)}"><span class="c">${yn(y)}.${u.n}</span>${esc(u.title)}</a>`).join('')
          : '<span style="font-size:13.5px;color:var(--ink-3);font-style:italic">Not currently carried by a Key Stage 3 unit.</span>'}</div></div>`;
    }).join(''),'Reference');

  add('sources','Sources',
    `<h2 class="sec">Sources</h2><div class="src">${B.sources.map(([t,w,url])=>
      `<div><b>${esc(t)}</b><span>${esc(w)}</span><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>`).join('')}</div>
     <footer class="foot">${esc(B.school)} · ${esc(B.title)} · ${esc(B.year)}</footer>`,'Reference');

  // ---------- render ----------
  document.getElementById('main').innerHTML = S.map(s=>`<section id="${s.id}">${s.html}</section>`).join('');

  const groups=[];
  S.forEach(s=>{ let g=groups.find(x=>x.name===s.group); if(!g){g={name:s.group,items:[]};groups.push(g);} g.items.push(s); });
  document.getElementById('toc').innerHTML = `<div class="cols">` + groups.map(g=>
    `<div><div class="grp">${esc(g.name)}</div>${g.items.map(s=>`<a href="#${s.id}" data-t="${s.id}">${esc(s.label)}</a>`).join('')}</div>`
  ).join('') + `</div>`;

  // scroll spy
  const links = [...document.querySelectorAll('nav.toc a')];
  const secs = S.map(s=>document.getElementById(s.id));
  const spy = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      links.forEach(a=>a.classList.toggle('on', a.dataset.t===e.target.id));
    }});
  }, {rootMargin:'0px 0px -72% 0px', threshold:0});
  secs.forEach(s=>s&&spy.observe(s));
})();
</script>
</body>
</html>
