<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Graveney School Key Stage 3 Computing curriculum plan, Years 7 to 9.">
    <style>
        :root {
            color-scheme: light dark
        }

        html {
            -webkit-text-size-adjust: 100%
        }

        body {
            margin: 0
        }

        img {
            max-width: 100%;
            height: auto
        }

        [hidden] {
            display: none !important
        }
    </style>
    <title>Graveney KS3 Computing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">

    <style>
        :root {
            --teal: #0F7A78;
            --teal-deep: #0A5D5C;
            --navy: #1B2A4A;
            --cream: #F6F1E3;
            --ground: #FBF9F4; /* warm neutral, biased to the cream */
            --surface: #FFFFFF;
            --surface-2: #F3EFE5;
            --ink: #1C2433;
            --ink-2: #4A5468;
            --ink-3: #7A8496;
            --rule: #E2DCCC;
            --rule-soft: #EDE8DA;
            --accent: var(--teal);
            --accent-ink: #0A5D5C;
            --chip: #E7F0EF;
            --flag-bg: #FDF3E0;
            --flag-rule: #C98A1E;
            --flag-ink: #7A5310;
            --shadow: 0 1px 2px rgba(27,42,74,.05), 0 8px 24px -16px rgba(27,42,74,.18);
            --display: "Literata",Georgia,"Times New Roman",serif;
            --body: "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
            --mono: "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            --maxw: 1180px;
            color-scheme: light;
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --teal: #4FC3BE;
                --teal-deep: #7FD8D3;
                --navy: #0C1322;
                --cream: #1A2133;
                --ground: #0C1220;
                --surface: #141C2D;
                --surface-2: #1A2334;
                --ink: #E9EDF5;
                --ink-2: #AFBACB;
                --ink-3: #7C8899;
                --rule: #273245;
                --rule-soft: #1E2839;
                --accent: #4FC3BE;
                --accent-ink: #7FD8D3;
                --chip: #16302F;
                --flag-bg: #2A2011;
                --flag-rule: #B58136;
                --flag-ink: #E8C68A;
                --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --teal: #4FC3BE;
            --teal-deep: #7FD8D3;
            --navy: #0C1322;
            --cream: #1A2133;
            --ground: #0C1220;
            --surface: #141C2D;
            --surface-2: #1A2334;
            --ink: #E9EDF5;
            --ink-2: #AFBACB;
            --ink-3: #7C8899;
            --rule: #273245;
            --rule-soft: #1E2839;
            --accent: #4FC3BE;
            --accent-ink: #7FD8D3;
            --chip: #16302F;
            --flag-bg: #2A2011;
            --flag-rule: #B58136;
            --flag-ink: #E8C68A;
            --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
            color-scheme: dark;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--ground);
            color: var(--ink);
            font-family: var(--body);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: var(--display);
            text-wrap: balance;
            margin: 0;
            line-height: 1.22;
            color: var(--ink)
        }

        p {
            margin: 0
        }

        a {
            color: var(--accent-ink)
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 3px
        }

        .wrap {
            max-width: var(--maxw);
            margin: 0 auto;
            padding-inline: 20px
        }

        /* ---------- masthead ---------- */
        .mast {
            border-bottom: 1px solid var(--rule);
            background: var(--surface)
        }

            .mast .wrap {
                padding-block: 40px 34px
            }

        .eyebrow {
            font-family: var(--mono);
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--accent-ink);
            margin-bottom: 14px;
        }

        .mast h1 {
            font-size: clamp(30px,5.2vw,46px);
            font-weight: 700;
            letter-spacing: -.015em
        }

        .mast .sub {
            font-family: var(--display);
            font-size: clamp(17px,2.4vw,21px);
            color: var(--accent-ink);
            margin-top: 6px
        }

        .mast .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 22px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--rule-soft);
            font-size: 13.5px;
            color: var(--ink-3);
        }

            .mast .meta b {
                font-weight: 600;
                color: var(--ink-2)
            }

        /* ---------- layout ---------- */
        .shell {
            display: grid;
            grid-template-columns: 216px minmax(0,1fr);
            gap: 44px;
            align-items: start
        }

            .shell > .wrap {
                padding-inline: 0
            }

        .page {
            max-width: var(--maxw);
            margin: 0 auto;
            padding-inline: 20px;
            padding-block: 0 72px
        }

        nav.toc {
            position: sticky;
            top: 0;
            max-height: 100vh;
            overflow-y: auto;
            padding-block: 34px 24px
        }

            nav.toc .grp {
                font-family: var(--mono);
                font-size: 10.5px;
                font-weight: 600;
                letter-spacing: .14em;
                text-transform: uppercase;
                color: var(--ink-3);
                margin: 20px 0 8px;
            }

                nav.toc .grp:first-child {
                    margin-top: 0
                }

            nav.toc a {
                display: block;
                padding: 4px 0 4px 11px;
                font-size: 13.5px;
                line-height: 1.4;
                color: var(--ink-2);
                text-decoration: none;
                border-left: 2px solid var(--rule);
            }

                nav.toc a:hover {
                    color: var(--accent-ink);
                    border-left-color: var(--accent)
                }

                nav.toc a.on {
                    color: var(--accent-ink);
                    font-weight: 600;
                    border-left-color: var(--accent)
                }

                nav.toc a .c {
                    font-family: var(--mono);
                    font-size: 11.5px;
                    color: var(--ink-3);
                    margin-right: 6px
                }

        main section {
            scroll-margin-top: 22px;
            padding-block: 38px 0
        }

            main section + section {
                border-top: 1px solid var(--rule-soft)
            }

        h2.sec {
            font-size: clamp(23px,3.2vw,30px);
            font-weight: 700;
            letter-spacing: -.012em;
            margin-bottom: 6px
        }

        .sec-note {
            color: var(--ink-2);
            max-width: 66ch;
            margin-top: 12px
        }

            .sec-note + .sec-note {
                margin-top: 11px
            }

        h3.sub {
            font-size: 19px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 8px
        }

        .prose {
            max-width: 66ch
        }

            .prose p + p {
                margin-top: 11px
            }

        /* ---------- principle / intent list ---------- */
        .defs {
            display: grid;
            gap: 0;
            margin-top: 22px;
            border-top: 1px solid var(--rule-soft)
        }

            .defs > div {
                display: grid;
                grid-template-columns: minmax(0,15rem) minmax(0,1fr);
                gap: 12px 32px;
                padding-block: 18px;
                border-bottom: 1px solid var(--rule-soft);
            }

            .defs dt, .defs h4 {
                font-family: var(--display);
                font-size: 16.5px;
                font-weight: 600;
                color: var(--accent-ink)
            }

            .defs p {
                color: var(--ink-2);
                font-size: 15.5px
            }

        /* ---------- overview grid ---------- */
        .grid-ov {
            display: grid;
            grid-template-columns: 78px repeat(3,minmax(0,1fr));
            gap: 1px;
            background: var(--rule);
            border: 1px solid var(--rule);
            margin-top: 24px;
            border-radius: 4px;
            overflow: hidden;
        }

            .grid-ov > * {
                background: var(--surface);
                padding: 11px 13px
            }

            .grid-ov .hd {
                background: var(--navy);
                color: #fff;
                font-family: var(--mono);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: .11em;
                text-transform: uppercase;
                padding-block: 10px;
            }

        :root[data-theme="dark"] .grid-ov .hd, :root:not([data-theme="light"]) .grid-ov .hd {
            background: var(--surface-2);
            color: var(--ink)
        }

        @media (prefers-color-scheme:light) {
            :root:not([data-theme="dark"]) .grid-ov .hd {
                background: var(--navy);
                color: #fff
            }
        }

        .grid-ov .term {
            background: var(--surface-2);
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--ink-2);
            display: flex;
            align-items: center;
        }

        .grid-ov .cell a {
            display: block;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.32;
            color: var(--ink);
        }

            .grid-ov .cell a:hover {
                color: var(--accent-ink)
            }

        .grid-ov .cell .code {
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--accent-ink);
            margin-right: 5px
        }

        .grid-ov .cell .th {
            font-size: 11px;
            color: var(--ink-3);
            margin-top: 5px;
            line-height: 1.35
        }

        .grid-ov .exambar {
            grid-column: 1 / -1;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            line-height: 1.4;
            padding: 7px 13px;
        }

            .grid-ov .exambar b {
                font-family: var(--mono);
                font-size: 10.5px;
                font-weight: 600;
                letter-spacing: .1em;
                text-transform: uppercase;
                margin-right: 2px;
            }

        :root[data-theme="dark"] .grid-ov .exambar,
        :root:not([data-theme="light"]) .grid-ov .exambar {
            color: #06201F
        }

        @media (prefers-color-scheme:light) {
            :root:not([data-theme="dark"]) .grid-ov .exambar {
                color: #fff
            }
        }

        /* ---------- thread weave matrix ---------- */
        .weave-scroll {
            overflow-x: auto;
            margin-top: 22px;
            padding-bottom: 4px
        }

        table.weave {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
            min-width: 640px
        }

            table.weave th, table.weave td {
                padding: 0;
                text-align: center
            }

                table.weave th.rowhd {
                    text-align: left;
                    font-family: var(--body);
                    font-size: 13px;
                    font-weight: 500;
                    color: var(--ink-2);
                    padding: 0 14px 0 0;
                    white-space: nowrap;
                    position: sticky;
                    left: 0;
                    background: var(--ground);
                }

                table.weave td.u {
                    width: 30px;
                    height: 26px
                }

            table.weave .dot {
                width: 13px;
                height: 13px;
                border-radius: 50%;
                margin: 0 auto;
                background: var(--rule);
                display: block;
            }

                table.weave .dot.on {
                    background: var(--accent);
                    box-shadow: 0 0 0 3px var(--chip)
                }

            table.weave th.colhd {
                font-family: var(--mono);
                font-size: 10px;
                font-weight: 600;
                color: var(--ink-3);
                padding-bottom: 8px;
                width: 30px;
                letter-spacing: 0;
            }

            table.weave tr.yrhd th {
                font-family: var(--mono);
                font-size: 10px;
                font-weight: 600;
                letter-spacing: .13em;
                text-transform: uppercase;
                color: var(--accent-ink);
                padding-bottom: 4px;
                text-align: center;
            }

            table.weave tbody tr:hover th.rowhd {
                color: var(--accent-ink)
            }

            table.weave td.sep {
                width: 12px
            }

        /* ---------- coverage tables ---------- */
        .tbl-scroll {
            overflow-x: auto;
            margin-top: 22px
        }

        table.data {
            border-collapse: collapse;
            width: 100%;
            min-width: 560px;
            font-size: 14.5px
        }

            table.data th, table.data td {
                text-align: left;
                vertical-align: top;
                padding: 11px 14px;
                border-bottom: 1px solid var(--rule-soft)
            }

            table.data thead th {
                font-family: var(--mono);
                font-size: 10.5px;
                font-weight: 600;
                letter-spacing: .11em;
                text-transform: uppercase;
                color: var(--ink-3);
                border-bottom: 1px solid var(--rule);
            }

            table.data td.n {
                font-family: var(--mono);
                font-weight: 600;
                color: var(--accent-ink);
                white-space: nowrap;
                width: 1%
            }

            table.data td.refs {
                font-family: var(--mono);
                font-size: 12.5px;
                font-weight: 500;
                color: var(--ink-2);
                white-space: nowrap;
                width: 1%
            }

                table.data td.refs.gap {
                    font-family: var(--body);
                    font-style: italic;
                    font-weight: 400;
                    color: var(--ink-3);
                    white-space: normal
                }

            table.data tbody tr:hover {
                background: var(--surface-2)
            }

        /* ---------- unit entries ---------- */
        .yearbar {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-top: 34px;
            padding-bottom: 9px;
            border-bottom: 2px solid var(--accent);
        }

            .yearbar h3 {
                font-size: 22px;
                font-weight: 700
            }

            .yearbar span {
                font-family: var(--mono);
                font-size: 11.5px;
                color: var(--ink-3)
            }

        article.unit {
            padding-block: 30px;
            border-bottom: 1px solid var(--rule-soft)
        }

            article.unit > header {
                margin-bottom: 16px
            }

        .unit h4 {
            font-size: 21px;
            font-weight: 600;
            letter-spacing: -.008em
        }

            .unit h4 .code {
                font-family: var(--mono);
                font-size: 15px;
                font-weight: 600;
                color: var(--accent-ink);
                margin-right: 9px
            }

        .unit .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            align-items: center
        }

        .pill {
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--accent-ink);
            background: var(--chip);
            padding: 3px 8px;
            border-radius: 3px;
            white-space: nowrap;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

            .pill.plain {
                background: transparent;
                color: var(--ink-3);
                padding-left: 0
            }

        .j277 .codes .pill {
            white-space: normal;
            line-height: 1.5
        }

        .flag {
            background: var(--flag-bg);
            border-left: 3px solid var(--flag-rule);
            color: var(--flag-ink);
            padding: 10px 14px;
            font-size: 13.5px;
            font-weight: 500;
            margin-block: 14px;
            border-radius: 0 3px 3px 0;
        }

        .fields {
            display: grid;
            gap: 18px;
            margin-top: 4px
        }

        .field > .lbl {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin-bottom: 6px;
        }

        .field p, .field li {
            font-size: 15px;
            color: var(--ink-2)
        }

        .field .prose p {
            max-width: 66ch
        }

        ol.lessons {
            margin: 0;
            padding: 0;
            list-style: none;
            counter-reset: l;
            display: grid;
            gap: 1px;
            background: var(--rule-soft);
            border: 1px solid var(--rule-soft);
            border-radius: 4px;
            overflow: hidden
        }

            ol.lessons li {
                counter-increment: l;
                background: var(--surface);
                padding: 8px 13px 8px 40px;
                position: relative;
                font-size: 14.5px;
                color: var(--ink);
            }

                ol.lessons li::before {
                    content: counter(l);
                    position: absolute;
                    left: 0;
                    top: 0;
                    bottom: 0;
                    width: 30px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-family: var(--mono);
                    font-size: 11.5px;
                    font-weight: 600;
                    color: var(--accent-ink);
                    background: var(--surface-2);
                }

        ul.plain {
            margin: 0;
            padding-left: 18px
        }

            ul.plain li {
                margin-bottom: 4px
            }

            ul.plain::marker {
                color: var(--accent)
            }

        .vocab {
            display: flex;
            flex-wrap: wrap;
            gap: 5px
        }

            .vocab span {
                font-size: 12.5px;
                color: var(--ink-2);
                background: var(--surface-2);
                padding: 2.5px 8px;
                border-radius: 3px;
                border: 1px solid var(--rule-soft);
            }

        .nclist {
            display: grid;
            gap: 9px
        }

            .nclist > div {
                display: grid;
                grid-template-columns: 22px minmax(0,1fr);
                gap: 10px;
                align-items: start
            }

            .nclist .n {
                font-family: var(--mono);
                font-size: 12.5px;
                font-weight: 600;
                color: var(--accent-ink);
                padding-top: 1px
            }

            .nclist p {
                font-size: 14px;
                color: var(--ink-2)
            }

        .j277 .codes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 7px
        }

        .two {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(258px,1fr));
            gap: 18px
        }

        /* ---------- thread appendix ---------- */
        .threadcard {
            padding-block: 20px;
            border-bottom: 1px solid var(--rule-soft)
        }

            .threadcard h4 {
                font-size: 17px;
                font-weight: 600
            }

            .threadcard .desc {
                font-size: 14.5px;
                color: var(--ink-3);
                margin-top: 4px;
                max-width: 66ch
            }

            .threadcard .chain {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-top: 11px;
                align-items: center
            }

                .threadcard .chain a {
                    font-size: 13px;
                    text-decoration: none;
                    color: var(--ink);
                    background: var(--surface);
                    border: 1px solid var(--rule);
                    padding: 4px 9px;
                    border-radius: 3px;
                }

                    .threadcard .chain a:hover {
                        border-color: var(--accent);
                        color: var(--accent-ink)
                    }

                    .threadcard .chain a .c {
                        font-family: var(--mono);
                        font-size: 11px;
                        color: var(--accent-ink);
                        margin-right: 5px
                    }

                .threadcard .chain .arrow {
                    color: var(--ink-3);
                    font-size: 12px
                }

        /* ---------- sources / foot ---------- */
        .src {
            display: grid;
            gap: 16px;
            margin-top: 20px
        }

            .src > div {
                padding-left: 13px;
                border-left: 2px solid var(--rule)
            }

            .src b {
                font-weight: 600;
                display: block;
                font-size: 15px
            }

            .src span {
                font-size: 13.5px;
                color: var(--ink-3);
                display: block;
                margin-block: 2px 4px
            }

            .src a {
                font-size: 13px;
                word-break: break-all
            }

        footer.foot {
            margin-top: 44px;
            padding-top: 20px;
            border-top: 1px solid var(--rule);
            font-size: 13px;
            color: var(--ink-3)
        }

        /* ---------- responsive ---------- */
        @media (max-width:880px) {
            .shell {
                grid-template-columns: minmax(0,1fr);
                gap: 0
            }

            nav.toc {
                position: static;
                max-height: none;
                padding-block: 22px 0;
                border-bottom: 1px solid var(--rule-soft)
            }

                nav.toc .cols {
                    display: grid;
                    grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
                    gap: 2px 22px
                }

            .defs > div {
                grid-template-columns: minmax(0,1fr);
                gap: 5px
            }

            .grid-ov {
                grid-template-columns: 64px repeat(3,minmax(0,1fr));
                font-size: 13px
            }

                .grid-ov > * {
                    padding: 9px 9px
                }

                .grid-ov .cell a {
                    font-size: 12.5px
                }
        }

        @media (max-width:560px) {
            .grid-ov {
                grid-template-columns: minmax(0,1fr)
            }

                .grid-ov .hd {
                    display: none
                }

                .grid-ov .term {
                    grid-column: 1
                }
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>

    <script type="application/json" id="data">        {
         "nc": {

  const B = JSON.parse(document.getElementById('data').textContent);
  const YEARS = ['Year 7','Year 8','Year 9'];
  const TERMS = ['Autumn 1','Autumn 2','Spring 1','Spring 2','Summer 1','Summer 2'];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const rich = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const paras = s => s.split('\n\n').map(t=>`<p>${rich(t)}</p>`).join('');
  const yn = y => y.slice(-1);
  const uid = (y,u) => `u${yn(y)}-${u.n}`;
  const allUnits = () => YEARS.flatMap(y => B.years[y].map(u => ({y,u})));

  // ---------- masthead ----------
  document.getElementById('eyebrow').textContent = B.school;
  document.getElementById('mtitle').textContent = B.title;
  document.getElementById('msub').textContent = B.subtitle;
  document.getElementById('mmeta').innerHTML = [
    `<span><b>${B.year}</b></span>`,
    `<span>${esc(B.authorRole)}</span>`,
    `<span><b>18</b> units · <b>108</b> lessons · one 60-minute lesson per week</span>`,
  ].join('');

  // ---------- sections ----------
  const S = [];
  const add = (id,label,html,group) => S.push({id,label,html,group});

  add('how','How to use this document', `<h2 class="sec">How to use this document</h2><div class="prose sec-note">${paras(B.howToUse)}</div>`,'Curriculum');

  add('intent','Curriculum intent',
    `<h2 class="sec">Curriculum intent</h2><div class="defs">` +
    B.intent.map(([t,b])=>`<div><h4>${esc(t)}</h4><div class="prose">${paras(b)}</div></div>`).join('') +
    `</div>`,'Curriculum');

  add('principles','Curriculum principles',
    `<h2 class="sec">Curriculum principles</h2><p class="sec-note">Seven principles govern the design of this curriculum. They are the reasons behind the decisions recorded in the rest of this document.</p><div class="defs">` +
    B.principles.map(([t,b])=>`<div><h4>${esc(t)}</h4><div class="prose">${paras(b)}</div></div>`).join('') +
    `</div>`,'Curriculum');

  // threads + weave matrix
  const units = allUnits();
  const weave = `<div class="weave-scroll"><table class="weave">
    <thead>
      <tr class="yrhd"><th class="rowhd"></th>${YEARS.map((y,i)=>`${i?'<th class="sep"></th>':''}<th colspan="6">${esc(y)}</th>`).join('')}</tr>
      <tr><th class="rowhd"></th>${YEARS.map((y,i)=>`${i?'<th class="sep"></th>':''}${B.years[y].map(u=>`<th class="colhd" title="${esc(u.title)}">${yn(y)}.${u.n}</th>`).join('')}`).join('')}</tr>
    </thead>
    <tbody>${B.threads.map(([name])=>`<tr><th class="rowhd">${esc(name)}</th>${
      YEARS.map((y,i)=>`${i?'<td class="sep"></td>':''}${B.years[y].map(u=>{
        const on=(u.threads||[]).includes(name);
        return `<td class="u"><span class="dot${on?' on':''}" title="${on?esc(yn(y)+'.'+u.n+' '+u.title):''}"></span></td>`;
      }).join('')}`).join('')
    }</tr>`).join('')}</tbody></table></div>`;

  add('threads','Threads',
    `<h2 class="sec">Threads</h2><div class="prose sec-note">${paras(B.threadsIntro)}</div>
     <h3 class="sub">How the threads weave through Key Stage 3</h3>
     <p class="sec-note">Each row is a thread; each column is a unit, in teaching order. A filled dot means that unit carries that thread.</p>
     ${weave}
     <h3 class="sub">What each thread covers</h3>
     <div class="defs">${B.threads.map(([n,d])=>`<div><h4>${esc(n)}</h4><p>${esc(d)}</p></div>`).join('')}</div>`,'Curriculum');

  add('delivery','Curriculum delivery',
    `<h2 class="sec">Curriculum delivery</h2><div class="prose sec-note">${paras(B.delivery)}</div>`,'Curriculum');

  const examTable = `<div class="tbl-scroll"><table class="data">
     <thead><tr><th>Paper</th><th>When</th><th>Covers</th><th>Weighting</th></tr></thead>
     <tbody>${B.exams.map(e=>`<tr><td class="n">${esc(e.name)}</td><td>${esc(e.when)}</td>
       <td class="refs" style="white-space:normal">${esc(e.covers)}</td><td>${esc(e.weighting)}</td></tr>`).join('')}
     </tbody></table></div>`;

  add('assessment','Assessment',
    `<h2 class="sec">Assessment</h2><div class="prose sec-note">${paras(B.assessmentIntro)}</div>
     <h3 class="sub">${esc(B.assessmentParts[0][0])}</h3><div class="prose sec-note">${paras(B.assessmentParts[0][1])}</div>
     <h3 class="sub">${esc(B.assessmentParts[1][0])}</h3><div class="prose sec-note">${paras(B.assessmentParts[1][1])}</div>
     ${examTable}
     ${B.assessmentParts.slice(2).map(([t,b])=>
        `<h3 class="sub">${esc(t)}</h3><div class="prose sec-note">${paras(b)}</div>`).join('')}`,'Curriculum');

  // NC coverage
  const ncUnits = n => units.filter(({u})=>u.nc.includes(Number(n))).map(({y,u})=>`${yn(y)}.${u.n}`);
  add('nc','National Curriculum coverage',
    `<h2 class="sec">National Curriculum coverage</h2><p class="sec-note">${esc(B.ncIntro)}</p>
     <div class="tbl-scroll"><table class="data"><thead><tr><th></th><th>Pupils should be taught to…</th><th>Units</th></tr></thead>
     <tbody>${Object.keys(B.nc).map(k=>`<tr><td class="n">${k}</td><td>${esc(B.nc[k])}</td><td class="refs">${ncUnits(k).join(', ')}</td></tr>`).join('')}
     </tbody></table></div>
     <p class="sec-note" style="font-size:13.5px;color:var(--ink-3)">Unit references are given as year.unit — so 8.4 is Year 8, Unit 4.</p>`,'Curriculum');

  // KS4
  const jUnits = c => units.filter(({u})=>u.j277.some(x=>x.code===c)).map(({y,u})=>`${yn(y)}.${u.n}`);
  add('ks4','Progression to Key Stage 4',
    `<h2 class="sec">Progression to Key Stage 4</h2><div class="prose sec-note">${paras(B.ks4Intro)}</div>
     <h3 class="sub">J277 topic coverage across Key Stage 3</h3>
     <div class="tbl-scroll"><table class="data"><thead><tr><th></th><th>OCR J277 topic</th><th>Units that feed it</th></tr></thead>
     <tbody>${Object.keys(B.j277).map(c=>{const h=jUnits(c);
       const note=(B.j277GapNote||{})[c]||'Taught at Key Stage 4';
       return `<tr><td class="n">${c}</td><td>${esc(B.j277[c])}</td><td class="refs${h.length?'':' gap'}">${h.length?h.join(', '):esc(note)}</td></tr>`;
     }).join('')}</tbody></table></div>
     <h3 class="sub">Where the Key Stage 3 boundary sits</h3><div class="prose sec-note">${paras(B.ks4Boundaries)}</div>`,'Curriculum');

  // overview
  add('overview','Long-term overview',
    `<h2 class="sec">Long-term overview</h2><p class="sec-note">Eighteen units across three years, one per half-term. The order below is the order of delivery.</p>
     <div class="grid-ov">
       <div class="hd"></div>${YEARS.map(y=>`<div class="hd">${esc(y)}</div>`).join('')}
       ${TERMS.map((t,i)=>{
          const row = `<div class="term">${esc(t)}</div>` + YEARS.map(y=>{
            const u=B.years[y][i];
            return `<div class="cell"><a href="#${uid(y,u)}"><span class="code">${yn(y)}.${u.n}</span>${esc(u.title)}</a><div class="th">${(u.threads||['Threads to confirm']).join(' · ')}</div></div>`;
          }).join('');
          const ex = B.exams[B.examAfterTerm[String(i)]];
          return row + (ex ? `<div class="exambar"><b>${esc(ex.name)}</b> · ${esc(ex.when)} — ${esc(ex.covers)}. ${esc(ex.weighting)}</div>` : '');
        }).join('')}
     </div>
     <p class="sec-note" style="font-size:13.5px;color:var(--ink-3)">The three examinations sit in a buffer lesson at the end of Autumn 2, Spring 2 and Summer 1. Every unit keeps six teaching lessons.</p>`,'Curriculum');

  // unit entries
  function unitHTML(y,u){
    const lessons = u.lessons||[];
    const f=[];
    if(u.description) f.push(`<div class="field"><div class="lbl">Unit description</div><div class="prose">${paras(u.description)}</div></div>`);
    if(u.why) f.push(`<div class="field"><div class="lbl">Why this, why now?</div><div class="prose">${paras(u.why)}</div></div>`);
    f.push(`<div class="field"><div class="lbl">Lessons in unit</div>${
      lessons.length ? `<ol class="lessons">${lessons.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>` : `<p style="font-style:italic;color:var(--ink-3)">To be confirmed.</p>`
    }${lessons.length>6?`<div class="flag">To confirm — the source unit runs ${lessons.length} lessons; Graveney teaches six. Confirm which six.</div>`:''}</div>`);
    if((u.prior||[]).length) f.push(`<div class="field"><div class="lbl">Prior knowledge requirements</div><ul class="plain">${u.prior.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`);
    f.push(`<div class="two">
      <div class="field"><div class="lbl">National Curriculum</div><div class="nclist">${
        u.nc.map(n=>`<div><span class="n">${n}</span><p>${esc(B.nc[String(n)])}</p></div>`).join('')}</div></div>
      <div class="field j277"><div class="lbl">Progression to GCSE (OCR J277)</div>
        <div class="codes">${u.j277.map(x=>`<span class="pill">${x.code} ${esc(x.title)}</span>`).join('')}</div>
        <p>${esc(u.j277_note)}</p></div>
    </div>`);
    f.push(`<div class="field"><div class="lbl">Key vocabulary</div><div class="vocab">${u.vocab.map(v=>`<span>${esc(v)}</span>`).join('')}</div></div>`);
    f.push(`<div class="two">
      <div class="field"><div class="lbl">Assessment</div>
        <p><b>Examination.</b> ${esc(u.exam_line)}</p>
        <p style="margin-top:7px"><b>End-of-unit check.</b> ${esc(u.quiz)}</p>
        <p style="margin-top:7px"><b>${u.exams && u.exams.length ? 'Question bank.' : 'Outcome assessment.'}</b> ${esc(u.bank)}</p></div>
      <div class="field"><div class="lbl">Homework</div><p>${esc(u.homework)}</p></div>
    </div>`);
    if(u.flag) f.push(`<div class="flag"><b>To confirm.</b> ${esc(u.flag)}</div>`);
    if(u.note) f.push(`<div class="field"><div class="lbl">Note</div><p>${esc(u.note)}</p></div>`);

    return `<article class="unit" id="${uid(y,u)}">
      <header>
        <h4><span class="code">${yn(y)}.${u.n}</span>${esc(u.title)}</h4>
        <div class="tags">
          <span class="pill plain">${esc(TERMS[u.n-1])}</span>
          <span class="pill plain">${lessons.length||6} lessons</span>
          ${(u.threads||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('') || '<span class="pill">Threads to confirm</span>'}
        </div>
      </header>
      ${!u.lessons?`<div class="flag">To complete — lesson titles, description and prior knowledge still to be added.</div>`:''}
      <div class="fields">${f.join('')}</div>
    </article>`;
  }

  YEARS.forEach(y=>{
    add('y'+yn(y), y+' units',
      `<div class="yearbar"><h3>${esc(y)} units</h3><span>6 units · 36 lessons</span></div>` +
      B.years[y].map(u=>unitHTML(y,u)).join(''), 'Units');
  });

  // thread appendix
  add('threadmap','Threads in computing',
    `<h2 class="sec">Threads in computing</h2><p class="sec-note">Each thread below lists the units that carry it, in teaching order, so the development of a single idea across Key Stage 3 can be read in one place.</p>` +
    B.threads.map(([name,desc])=>{
      const hits = units.filter(({u})=>(u.threads||[]).includes(name));
      return `<div class="threadcard"><h4>${esc(name)}</h4><p class="desc">${esc(desc)}</p>
        <div class="chain">${hits.length
          ? hits.map(({y,u},i)=>`${i?'<span class="arrow">→</span>':''}<a href="#${uid(y,u)}"><span class="c">${yn(y)}.${u.n}</span>${esc(u.title)}</a>`).join('')
          : '<span style="font-size:13.5px;color:var(--ink-3);font-style:italic">Not currently carried by a Key Stage 3 unit.</span>'}</div></div>`;
    }).join(''),'Reference');

  add('sources','Sources',
    `<h2 class="sec">Sources</h2><div class="src">${B.sources.map(([t,w,url])=>
      `<div><b>${esc(t)}</b><span>${esc(w)}</span><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>`).join('')}</div>
     <footer class="foot">${esc(B.school)} · ${esc(B.title)} · ${esc(B.year)}</footer>`,'Reference');

  // ---------- render ----------
  document.getElementById('main').innerHTML = S.map(s=>`<section id="${s.id}">${s.html}</section>`).join('');

  const groups=[];
  S.forEach(s=>{ let g=groups.find(x=>x.name===s.group); if(!g){g={name:s.group,items:[]};groups.push(g);} g.items.push(s); });
  document.getElementById('toc').innerHTML = `<div class="cols">` + groups.map(g=>
    `<div><div class="grp">${esc(g.name)}</div>${g.items.map(s=>`<a href="#${s.id}" data-t="${s.id}">${esc(s.label)}</a>`).join('')}</div>`
  ).join('') + `</div>`;

  // scroll spy
  const links = [...document.querySelectorAll('nav.toc a')];
  const secs = S.map(s=>document.getElementById(s.id));
  const spy = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      links.forEach(a=>a.classList.toggle('on', a.dataset.t===e.target.id));
    }});
  }, {rootMargin:'0px 0px -72% 0px', threshold:0});
  secs.forEach(s=>s&&spy.observe(s));
})();</script>
    ();
    </script>
    </body>
</html>
